// section Kinito rangée par thème, dans l'ordre des menus de FM (2026-11-09, demande du joueur) ; « option:x » = option
// Kinito portée par une fonction du skin (carte seule) ; les autres options Kinito vont dans la carte de leur fonction
const KINITO_GROUPES = [
  [["Portail et calendrier", "Portal and calendar"], ["option:rencontres", "kinito_calendrier_rencontres", "kinito_vacances_jour"]],
  [["Effectif, fiche joueur et jeunes", "Squad, player profile and youth"], ["kinito_entete_large", "kinito_capitaines_vues", "kinito_enregistrement", "kinito_cartes_jeunes"]],
  [["Tactiques : consignes (Terrain et vues FM24)", "Tactics: instructions (Pitch and FM24 views)"], ["kinito_consignes_essai_b"]],
  [["Tactiques : sélections d'équipe", "Tactics: team selections"], ["kinito_raccourcis_selections"]],
  [["Match", "Match"], ["kinito_fenetre_but"]],
  [["Recrutement et contrats", "Scouting and contracts"], ["kinito_rapports_vues", "kinito_contrat_cadenas"]],
  [["Entraînement", "Training"], ["kinito_echange_seances", "kinito_vue_equipes"]],
  [["Pays et sélections", "Nations and national teams"], ["kinito_pays_formation"]],
];
function kinitoOptions() {
  const fs = fonctionsDe("kinito");
  const opts = E.options.filter(o => o.kinito);
  if (!opts.length && !fs.length) return [el("div", { class: "vide neutre" }, t("kinitoVide"))];
  const vus = new Set();
  // option seule (sa fonction n'est pas dans la section) : réapplique la fonction du skin qui la porte
  const carteOption = o => {
    vus.add("option:" + o.nom);
    const f = fonction(o.script);
    return el("div", { class: "carte" + (o.actuelle !== o.defaut ? " ecart" : "") }, blocOption(o, f ? f.actif : true));
  };
  const carte = nom => {
    if (nom.startsWith("option:")) { const o = option(nom.slice(7)); return o && o.kinito ? carteOption(o) : null; }
    const f = fs.find(x => x.nom === nom);
    if (!f) return null;
    vus.add(nom);
    for (const o of f.options) vus.add("option:" + o);
    return carteFonction(f, true);
  };
  const out = [];
  for (const [titre, noms] of KINITO_GROUPES) {
    const cartes = noms.map(carte).filter(Boolean);
    if (cartes.length) out.push(el("h3", { class: "groupe-kinito" }, tr(titre)), el("div", { class: "liste" }, ...cartes));
  }
  // nouveautés de Kinito pas encore rangées : à la fin
  const reste = [...fs.filter(f => !vus.has(f.nom)).map(f => carte(f.nom)),
    ...opts.filter(o => !vus.has("option:" + o.nom)).map(carteOption)];
  if (reste.length) out.push(el("h3", { class: "groupe-kinito" }, tr(["Autres", "Others"])), el("div", { class: "liste" }, ...reste));
  return out;
}

  return ["barre", "texte", "barre2", "accent"].some(k => b[k]);
}

// touche de couleur du club sur la barre unie (2026-11-11, essai ; = touche_club.couches du skin) : fond CSS de l'aperçu
const TOUCHES = ["", "net", "doux", "halo", "liseret", "deux"];
const TOUCHE_LONG = 30, TOUCHE_FORCE = 45;   // = touche_club.LONG_BASE / FORCE_BASE
function toucheFond(b, p = "#C8102E", s = "#FFFFFF") {   // club d'exemple : rouge / blanc (le bordeaux des rayures ne se voit pas)
  if (!b.barre || !TOUCHES.includes(b.touche) || !b.touche) return "";
  const L = b.touche_long || TOUCHE_LONG, f = (b.touche_force || TOUCHE_FORCE) / 100;
  const c = (h, a) => `rgba(${[1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).join(",")},${Math.max(0, Math.min(1, a)).toFixed(3)})`;
  const m = L * .45;
  return {
    net: `linear-gradient(90deg, ${c(p, f)} 0%, ${c(p, f)} ${L * .25}%, ${c(p, 0)} ${L}%)`,
    doux: `linear-gradient(90deg, ${c(p, f * .85)} 0%, ${c(p, 0)} ${L}%)`,
    halo: `radial-gradient(ellipse ${L}% 100% at 24px 50%, ${c(p, f)} 0%, ${c(p, f * .45)} 35%, ${c(p, 0)} 100%)`,
    liseret: `linear-gradient(90deg, ${c(p, f * 1.8)} 0%, ${c(p, 0)} ${L}%) bottom / 100% 3px no-repeat`,
    deux: `linear-gradient(90deg, ${c(p, f)} 0%, ${c(s, f * .6)} ${m}%, ${c(s, 0)} ${L}%)`,
  }[b.touche];
}

function apercuBarres(b) {
  const club = "repeating-linear-gradient(135deg, #7A1430 0 12px, #6A1029 12px 24px)";   // couleur du club : varie
  const texte = b.texte || (b.barre && lum(b.barre) >= TEXTE_SEUIL_NOIR ? "#111111" : "#FFFFFF");
  const acc = (b.boutons || b.accent || "").slice(0, 7) || null;   // boutons choisis : passent avant l'accent
  // bouton Continuer (2026-11-11) : rouge de FM jamais recoloré ; thème = aplat, club = couleur du club (rayures)
  const mode = b.continuer || (acc ? "theme" : "fm");
  const cont = mode === "club" ? club : mode === "theme" && acc ? acc : "linear-gradient(90deg, #A40FC7, #E50F51)";
  const texteCont = mode === "theme" && acc && lum(acc) >= .85 ? "#000000" : "#FFFFFF";
  const violet = recolorer(ACCENT_FM, acc);
  return el("div", { class: "apercu-barres" },
    el("div", { class: "ap-barre", style: `background:${b.barre || club};color:${texte}` },
      toucheFond(b) ? el("span", { class: "ap-touche", style: `background:${toucheFond(b)}` }) : null,
      el("span", { class: "ecusson" }),
      el("span", { class: "menu" }, t("apercuMenus")), el("span", { class: "menu actif" }, t("apercuMenus2")), el("span", { class: "menu" }, t("apercuMenus3")),
      el("span", { class: "icone" }),
      el("span", { class: "ap-continuer", style: `background:${cont};color:${texteCont}` }, t("apercuContinuer"))),
    liseretCache(b) ? null : el("div", { class: "ap-liseret" }),
    el("div", { class: "ap-barre2", style: `background:${b.barre2 || club}` }, t("apercuSection")),
    el("div", { class: "ap-page" },
      el("span", { class: "ap-onglet", style: `border-color:${violet};color:#fff` }, t("apercuOnglet")),
      el("span", { class: "ap-inter", style: `background:${violet}` }),
      el("span", { class: "ap-ligne", style: `background:${recolorer("#AF78FF", b.accent)}59` }, "J. Dupont · 14")));
}

function blocBarres() {

      tuiles: null, touche: null, touche_long: null, touche_force: null, ombrage: null, polygone: null };

  const presets = el("div", { class: "zone-themes" });

  const majApercu = () => {
    lierTuiles(b);
    if (aideTouche) aideTouche.textContent = t(b.barre ? "cToucheAide" : "cToucheSansBarre");
    zone.textContent = ""; zone.append(apercuBarres(b));
    zoneTac.textContent = ""; zoneTac.append(apercuTactiques(b));
    zoneTuiles.textContent = ""; zoneTuiles.append(apercuTuiles(b));
    zoneScore.textContent = ""; zoneScore.append(apercuScore(b));
    caseLiseret.checked = !liseretCache(b);   // auto : suit les couleurs choisies
    themeActuel();   // l'app prend l'accent en cours de choix
    presets.textContent = ""; presets.append(...zoneThemes());
  };
  const ligne = k => {
    // champs toujours modifiables : une couleur tapée ou prise à la pipette décoche « couleur de FM » (avant : grisés,
    // le joueur croyait la couleur prise, 2026-10-31)

    const pipette = el("input", { type: "color", value: base6(hexa) || COULEURS_PROPOSEES[k] || "#232735", "aria-label": t(COULEURS_TITRES[k]) });
    const texte = el("input", { type: "text", value: hexa || "", placeholder: "#RRGGBB", "aria-label": t(COULEURS_TITRES[k]) });
    // opacité : gardée quand on change la couleur ; bouger le curseur prend la couleur affichée
    const op = curseurOpacite(opaciteDe(hexa), pc => { const h = avecOpacite(hexOk(texte.value) || pipette.value.toUpperCase(), pc); texte.value = h; prendre(h); });
    const caseFM = el("input", { type: "checkbox", checked: !b[k] });
    // tuiles : 2e case « comme le grand panneau » (2026-11-07, demande du joueur) ; les deux cases s'excluent

    const champ = el("div", { class: "champ" + (hexa ? "" : " fm") }, pipette, texte);
    const prendre = h => { b[k] = h; caseFM.checked = false; if (casePanneau) casePanneau.checked = false; champ.classList.remove("fm"); majApercu(); };
    caseFM.addEventListener("change", () => {
      b[k] = caseFM.checked ? null : (hexOk(texte.value) || pipette.value.toUpperCase());
      if (casePanneau) casePanneau.checked = false;
      champ.classList.toggle("fm", caseFM.checked);
      texte.value = b[k] || "";

      b[k] = casePanneau.checked ? TUILES_PANNEAU : null;

      texte.value = "";

  // trait entre les deux barres : affiché (FM, de base) ou caché ; pas une couleur

  // touche de couleur du club (2026-11-11, essai, demande du joueur : maquettes A-E + longueur) : segments comme le

      liseretCache(actuel) ? `${t("liseretCache")} · ` : "", t("pasLeChoixDeBase"))

  // les deux boutons « Appliquer » envoient tout le brouillon (barres + Tactiques) : une seule action « couleurs »

  const tacActuel = f.actif && E.couleurs && TACTIQUES.some(k => actuel[k]);
  // bouton Continuer (2026-11-11) : choix (couleurs_interface clé « continuer »), pas une couleur ; null = auto.

    el("div", { class: "boutons-section" },

  };
  // ordre d'affichage (2026-11-09) : menus (WIP) en dernier ; match : score, commentaire, puis boutons et effectif
  // case cochée : seule la ligne « Fond des tuiles » reste, panneaux et fiche la suivent

// fond + barres / accent en une seule tâche (action « theme » du serveur)
function appliquerTheme() {
  const tb = themeBrouillon();
  if (!brouillon?.fm && !tb.fond) return avis(t("couleurAide"));
  const choisi = tousThemes().find(p => memeTheme(p, tb));
  faire({ type: "theme", titre: choisi ? tr(choisi.nom) : t("presetPerso"), couleur: tb.fond, infobulle: tb.info || "", lisse: !!brouillon?.lisse,
    barre: tb.barre || "", texte: tb.texte || "", barre2: tb.barre2 || "", accent: tb.accent || "",
    ...Object.fromEntries([...TACTIQUES, ...THEME_EN_PLUS, ...THEME_APRES].map(k => [k, tb[k] || ""])), continuer: tb.continuer || "",
    liseret: brouillonBarres?.liseret || "",
    touche: tb.touche || "", ...(tb.touche_long ? { touche_long: tb.touche_long } : {}), ...(tb.touche_force ? { touche_force: tb.touche_force } : {}),
    ombrage: typeof brouillonBarres?.ombrage === "number" ? brouillonBarres.ombrage : "" });   // "" = 65 % de FM
}
// ombrage derrière les fenêtres par-dessus le jeu (2026-11-14, le joueur : Traitement entre les jours, options caméra) :
// opacité en % du fond sombre de FM (couleurs_interface clé « ombrage ») ; null = 65 % de FM, pour tous les thèmes ; pas
// une clé des thèmes (gardé quand on en prend un), envoyé avec « Appliquer le thème » et « Appliquer » des couleurs
const OMBRAGE_FM = 65;
function ligneOmbrage() {
  const b = brouillonBarres || {};

  const v = typeof b.ombrage === "number" ? b.ombrage : OMBRAGE_FM;
  const val = el("span", { class: "val" }, `${v} %`);

function basculer(f) {
  if (E.fm_ouvert) return avis(t("fermeFM"));
  if (f.nom === "theme_fond" || f.nom === "couleurs_interface") return aller({ page: "fond" });
  if (!f.actif) return faire({ type: "appliquer", nom: f.nom });
  confirmer(t("retirerTitre"), `${tr([f.fr, f.en])}\n\n${t("retirerTexte")}`, t("retirer"), () => faire({ type: "retirer", nom: f.nom }));
}

// actions qui lancent une tâche (serveur.py : ECRIT + statut)
const TACHES_ECRITURE = new Set(["skin", "desinstaller", "appliquer", "reinstaller", "retirer", "option", "fond", "fond_retirer",
  "couleurs", "couleurs_retirer", "theme", "langue", "statut", "joueur_lot"]);
async function faire(d) {
  // v1.76 : bandeau « En cours… » dès le clic (avant : rien de visible jusqu'à la réponse et au 1er tour de suivi)
  const avant = TACHES_ECRITURE.has(d.type) && !$("#tache").classList.contains("visible");
  const ligneAvant = $("#tache-ligne").textContent;
  try {
    if (d.nom && (d.type === "appliquer" || d.type === "retirer")) { enAttente = d.nom; dessiner(); }   // bascule tout de suite
    if (TACHES_ECRITURE.has(d.type)) {
      $("#tache").classList.add("visible"); $("#tache-rond").className = "rond"; $("#tache-ligne").textContent = t("enCours");
      $("#tache-barre").classList.add("indetermine"); $("#tache-barre").style.width = "";
    }
    await api("/api/action", d);
    refus = null;
    await charger();   // charger() suit déjà la nouvelle tâche (sinon le journal s'affichait deux fois)
    if (!tacheSuivie) suivreTache(true);
  } catch (e) {
    enAttente = null; refus = { type: d.type, message: e.message };
    // Mac (v1.87) : Gestion des apps -> fenêtre avec un bouton qui ouvre le bon réglage
    if (e.donnees?.mac_autorisation) confirmer(t("macAutTitre"), e.message, t("macAutBouton"),
      () => api("/api/action", { type: "mac_reglages" }).catch(x => avis(x.message)));
    else avis(e.message);
    if (TACHES_ECRITURE.has(d.type)) { $("#tache-barre").classList.remove("indetermine"); $("#tache-ligne").textContent = ligneAvant; if (avant) $("#tache").classList.remove("visible"); }
    dessiner();
  }
}

async function suivreTache(nouvelle) {
  tacheSuivie = true;
  const boite = $("#tache");
  if (nouvelle || E.tache.id !== tacheId) { tacheId = E.tache.id; tacheLignes = 0; derniereEtape = ""; $("#journal").textContent = ""; }
  boite.classList.add("visible");
  $("#tache-titre").textContent = E.tache.titre || "";
  $("#tache-rond").className = "rond";
  $("#tache-conseil").hidden = true;
  $("#tache-ia").hidden = true;
  while (true) {
    let d;
    try { d = await api(`/api/tache?depuis=${tacheLignes}`); } catch { avis(t("horsLigne")); break; }
    if (d.lignes.length) {
      const j = $("#journal");
      const bas = j.scrollTop + j.clientHeight >= j.scrollHeight - 8;
      j.append(d.lignes.join("\n") + "\n");
      if (bas) j.scrollTop = j.scrollHeight;
      tacheLignes = d.total;
    }
    // ligne sous le titre : la fonction en cours (titres « === ») ou la dernière ligne écrite
    const titreEnCours = [...d.lignes].reverse().find(x => x.startsWith("=== "));
    if (titreEnCours) derniereEtape = titreEnCours.replace(/^=== | ===$/g, "");
    else if (!derniereEtape) derniereEtape = [...d.lignes].reverse().find(x => x.trim()) || "";
    const ligne = (d.courante.includes("%") ? d.courante : "") || derniereEtape;
    $("#tache-ligne").textContent = d.fini ? (d.code ? t("echec") : t("fini")) : (ligne.trim() || t("enCours"));
    $("#tache-barre").classList.toggle("indetermine", d.avancement == null && !d.fini);
    $("#tache-barre").style.width = d.avancement != null ? `${Math.round(d.avancement * 100)}%` : (d.fini ? "100%" : "");
    $("#tache-barre").style.background = d.fini && d.code ? "var(--rouge)" : "";
    if (d.fini) {
      $("#tache-rond").className = "rond " + (d.code ? "erreur" : "ok");
      if (d.conseil) { $("#tache-conseil").textContent = tr(d.conseil); $("#tache-conseil").hidden = false; }
      const dejaExplique = d.code === 2 && ["sauvegarde", "skin"].includes(d.type);   // encadré « pas propre » sur la page
      if ((d.code && !dejaExplique) || ["statut", "etat_fonction"].includes(d.type)) montrerDetail(true);
      if (d.code && !dejaExplique && !String(d.type || "").startsWith("stades")) $("#tache-ia").hidden = false;
      apresTache(d);
      if (d.type === "maj" && !d.code) { tacheSuivie = false; return redemarrer(); }
      break;
    }
    await new Promise(r => setTimeout(r, 200));   // v1.76 : 500 -> 200 ms (lignes et fin affichées plus tôt)
  }
  tacheSuivie = false;
  enAttente = null;
  charger();
}

// ---------- démarrage : chargement le temps de chercher une mise à jour, puis page « mise à jour » ou l'app ----------
const DEMARRAGE_MAX = 10000;   // GitHub trop lent : l'app s'ouvre quand même (le bandeau de l'Accueil prend le relais)
async function demarrage() {
  const debut = Date.now();
  LG = langueNavigateur();
  await lireTraduction();
  $("#dem-texte").textContent = t("demVerif");
  await charger();
  while (E && E.maj?.etat === "verif" && Date.now() - debut < DEMARRAGE_MAX) {
    $("#dem-texte").textContent = t("demVerif");   // langue du joueur une fois l'état lu
    await new Promise(r => setTimeout(r, 400));
    await charger(false);
  }
  await new Promise(r => setTimeout(r, Math.max(0, 700 - (Date.now() - debut))));   // pas de clignotement
  if (E && E.maj?.etat === "dispo" && E.tache.fini) pageMajDemarrage();
  else if (E && E.maj_jeu && !assistant) pageMajJeu();
  else if (E && (E.stades?.anciens || E.trophees?.anciens) && !assistant) pageStadesMaj();
  else fermerDemarrage();
}

// v1.53 : photos de l'ancien pack (<id>.jpg) -> STDM<id>.jpg, obligatoire (pas de « plus tard ») ; aussi sur l'Accueil
// et en tête de la page Stades tant qu'il en reste
let migrationStades = false, migrationSuivi = { fait: 0, total: 0 };
// v1.54 : barre de progression = photos encore à l'ancien nom (lues dans /api/etat pendant le renommage)
function barreMigration() {   // redessinée par la page (Accueil) : repart de l'avancée en cours, pas de 0
  const b = el("div", { class: "barre-stades" }, el("div", { class: "barre" }, el("i", {})), el("span", { class: "aide" }));
  remplirBarre(b);
  return b;
}
function remplirBarre(b) {
  const { fait, total } = migrationSuivi, pct = total ? Math.min(100, Math.round(100 * fait / total)) : 0;
  b.hidden = !migrationStades;
  const fin = pct >= 100;   // v1.74 : photos renommées, reste les liens (~10-30 s) : barre qui bouge, pas figée à 100 %
  b.querySelector("i").classList.toggle("indetermine", fin);
  b.querySelector("i").style.width = pct + "%";
  b.querySelector("span").textContent = fin ? t("convLiens") : `${t("stMajEnCours")} ${nb(fait)} / ${nb(total)} (${pct} %)`;
}
function barreTrophees() {   // v1.74 : trophées, pas de compte possible : barre qui va et vient
  const b = el("div", { class: "barre-stades" }, el("div", { class: "barre" }, el("i", { class: "indetermine" })),
    el("span", { class: "aide" }, t("convLiens")));
  b.hidden = !migrationTrophees;
  return b;
}
function majBarreMigration() {
  document.querySelectorAll(".barre-stades").forEach(remplirBarre);
}
async function migrerStades(apres) {   // apres(fini, erreur) : écran de démarrage (l'avis passe sous lui)
  if (E.fm_ouvert) { avis(t("stMajFmOuvert")); return apres?.(false, t("stMajFmOuvert")); }
  const total = E.stades?.anciens || 0;
  migrationStades = true; migrationSuivi = { fait: 0, total }; dessiner(); apres?.(false, ""); majBarreMigration();
  const suivi = setInterval(async () => {   // le serveur répond pendant le renommage (une requête à la fois chacune)
    try {
      const e = await api("/api/etat");
      if (migrationStades) { migrationSuivi.fait = Math.max(migrationSuivi.fait, total - (e.stades?.anciens ?? total)); majBarreMigration(); }
    } catch { /* hors ligne un instant : la barre attend */ }
  }, 700);
  try {
    const r = await api("/api/action", { type: "stades_migrer" });
    clearInterval(suivi);
    migrationSuivi.fait = total; majBarreMigration();
    diagStades = r;
    avis(t("stMajFait").replace("{n}", nb(r.renommees)));
    migrationStades = false;
    await charger();
    apres?.(true, "");
  } catch (e) {
    clearInterval(suivi);
    migrationStades = false; avis(e.message); dessiner(); apres?.(false, e.message); majBarreMigration();
  }
}

// Kinito (10/11, soir) : les choix dans un menu déroulant au lieu de la rangée de boutons d'Alex. La rangée reste dans
// la page, cachée : choisir dans le menu clique SON bouton (ses règles : FM ouvert, choix déjà pris, « de base »)
function knLibelle(b) {
  const c = b.cloneNode(true);
  for (const x of c.querySelectorAll(".coche, .de-base")) x.remove();
  return c.textContent.trim();
}
function knFermerMenus(sauf) {
  for (const m of document.querySelectorAll(".kn-menu.ouvert")) if (m !== sauf) m.knFermer();
}
function knMenu(seg, cle) {
  const boutons = [...seg.querySelectorAll(":scope > button")];
  if (!boutons.length) return;
  const actuel = boutons.find(x => x.getAttribute("aria-checked") === "true") || boutons[0];
  const base = x => { const d = x.querySelector(".de-base"); return d ? el("span", { class: "kn-base" }, d.textContent) : null; };
  const liste = el("div", { class: "kn-menu-liste", role: "listbox", hidden: true });
  const menu = el("div", { class: "kn-menu" });
  const lignes = () => [...liste.querySelectorAll(".kn-menu-ligne:not(:disabled)")];
  const ouvrir = focus => {
    knFermerMenus(menu);
    liste.hidden = false; menu.classList.add("ouvert"); bouton.setAttribute("aria-expanded", "true");
    menu.closest(".carte")?.classList.add("kn-menu-dessus");   // la liste passe devant la carte d'en dessous
    knMenuOuvert = cle;
    if (focus) (liste.querySelector(".kn-menu-ligne.choisi:not(:disabled)") || lignes()[0] || bouton).focus();
  };
  menu.knFermer = (rendre) => {
    liste.hidden = true; menu.classList.remove("ouvert"); bouton.setAttribute("aria-expanded", "false");
    menu.closest(".carte")?.classList.remove("kn-menu-dessus");
    if (knMenuOuvert === cle) knMenuOuvert = null;
    if (rendre) bouton.focus();
  };
  const bouton = el("button", {
    type: "button", class: "kn-menu-bouton" + (actuel.classList.contains("pas-base") ? " pas-base" : ""),
    "aria-haspopup": "listbox", "aria-expanded": "false",
    onclick: () => liste.hidden ? ouvrir(false) : menu.knFermer(),
    onkeydown: e => { if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); ouvrir(true); } },
  }, el("span", { class: "kn-menu-texte" }, knLibelle(actuel)), base(actuel), el("span", { class: "kn-menu-fleche", "aria-hidden": "true" }, "▾"));
  for (const x of boutons) {
    const choisi = x === actuel;
    liste.append(el("button", {
      type: "button", class: "kn-menu-ligne" + (choisi ? " choisi" : ""), role: "option", "aria-selected": String(choisi),
      disabled: x.disabled, onclick: () => { menu.knFermer(true); if (!choisi) x.click(); },
    }, el("span", { class: "kn-menu-coche", "aria-hidden": "true" }, choisi ? "✓" : ""),
      el("span", { class: "kn-menu-texte" }, knLibelle(x)), base(x)));
  }
  liste.addEventListener("keydown", e => {
    const l = lignes(), i = l.indexOf(document.activeElement);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (l.length) l[(i + (e.key === "ArrowDown" ? 1 : l.length - 1)) % l.length].focus(); }
    else if (e.key === "Home" || e.key === "End") { e.preventDefault(); if (l.length) l[e.key === "Home" ? 0 : l.length - 1].focus(); }
    else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); menu.knFermer(true); }
    else if (e.key === "Tab") menu.knFermer();
  });
  menu.append(bouton, liste);
  seg.style.display = "none";
  seg.before(menu);
  if (knMenuOuvert === cle) ouvrir(false);
}
if (!window.knMenusEcoutes) {   // une fois : clic à côté ou Échap ferment le menu ouvert
  window.knMenusEcoutes = true;
  document.addEventListener("click", e => { if (!e.target.closest(".kn-menu")) knFermerMenus(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") knFermerMenus(); });
}

// la carte d'Alex repliée : nom court ; description, choix et « État » sous « Description » (Kinito, 10/11 :
// « Réglages » laissait croire qu'il y a toujours quelque chose à régler) ; s'il y a des choix, une étiquette pleine
// « ⚙ 3 CHOIX » à côté ; « ✓ À jour » là où Alex met « Réinstaller » quand il n'y a rien à réinstaller
function knReplier(carte, nom, f) {
  const tete = carte.querySelector(":scope > .carte-tete");
  if (!tete) return carte;
  const corps = el("div", { class: "kn-reglages" });
  const titre = tete.querySelector(".carte-titre");
  if (KN_COURTS[nom] && titre) {
    corps.append(el("div", { class: "option" }, el("p", { class: "option-aide", style: "margin:0" }, titre.textContent)));
    titre.textContent = tr(KN_COURTS[nom]);
  }
  for (const o of [...carte.children].filter(x => x.classList.contains("option"))) corps.append(o);
  const etat = [...tete.children].find(x => x.matches("button.bouton.discret"));
  if (etat) corps.append(el("div", { class: "option" }, etat));
  // Kinito (10/11, soir) : « À jour », remplacé par le « Réinstaller » d'Alex quand une mise à jour est à poser.
  // Mêmes conditions que l'app (serveur : skin installé, fonction activée, pas bloquée par FM Guru) : « à jour » = la
  // version de l'app est celle qu'elle a posée dans le jeu la dernière fois. Rien sur une fonction désactivée.
  if (f && f.actif && !f.reinstaller && !f.bloqueGuru && E.installation && E.installation.installe)
    tete.append(el("span", { class: "kn-a-jour", title: tr(["Le jeu a la version de l'app : rien à réinstaller", "The game has the app's version: nothing to reinstall"]) },
      el("span", { "aria-hidden": "true" }, "✓"), tr(["À jour", "Up to date"])));
  [...corps.querySelectorAll(".segments")].forEach((s, i) => knMenu(s, `${nom}:${i}`));
  if (!corps.children.length) return carte;
  const ouvert = knCartes.has(nom);
  corps.hidden = !ouvert;
  const n = corps.querySelectorAll(".segments").length;   // un choix = une rangée de boutons d'Alex (blocOption)
  const basculer = () => {
    const o = corps.hidden;
    corps.hidden = !o;
    b.setAttribute("aria-expanded", String(o));
    if (o) knCartes.add(nom); else knCartes.delete(nom);
  };
  // Kinito (10/11) : le bouton reste « Description » ; s'il y a des choix, une étiquette pleine juste à côté, qui se
  // voit tout de suite (« ⚙ 3 CHOIX ») et ouvre la même chose
  const b = el("button", { class: "kn-depli", "aria-expanded": String(ouvert), onclick: basculer },
    tr(["Description", "Description"]), el("span", { class: "kn-chevron", "aria-hidden": "true" }, "›"));
  if (n) tete.append(el("button", { class: "kn-choix", title: tr(["Des choix t'attendent dans la description", "Settings inside the description"]), onclick: basculer },
    el("span", { "aria-hidden": "true" }, "⚙"), tr([`${n} CHOIX`, `${n} SETTING${n > 1 ? "S" : ""}`])));
  tete.append(b);
  carte.classList.add("kn-compacte");
  carte.append(corps);
  if (corps.querySelector(".kn-menu.ouvert")) carte.classList.add("kn-menu-dessus");   // menu rouvert après un redessin
  return carte;
}

// un thème : son titre (combien d'ajouts, combien activés, combien de choix, ce qui attend), puis ses cartes, toujours
// visibles
function knTheme(titre, rangs) {
  const cartes = rangs.map(x => x.carte);
  const signaux = [];
  if (cartes.some(c => c.classList.contains("ecart"))) signaux.push(el("span", { class: "badge ambre" }, tr(["choix changé", "changed setting"])));
  // (une carte qui a aussi un choix changé porte « ecart » au lieu de « a-reinstaller » : on regarde son bouton)
  if (cartes.some(c => c.classList.contains("a-reinstaller") || c.querySelector(":scope > .carte-tete > .bouton.principal")))
    signaux.push(el("span", { class: "badge violet" }, t("reinstallerBadge")));
  const fonctions = rangs.filter(x => x.fonction);
  const n = fonctions.length, actifs = fonctions.filter(x => x.actif).length;
  const choix = cartes.reduce((a, c) => a + c.querySelectorAll(".segments").length, 0);
  const compte = [n ? tr([`${n} ajout${n > 1 ? "s" : ""} · ${actifs} activé${actifs > 1 ? "s" : ""}`,
    `${n} addition${n > 1 ? "s" : ""} · ${actifs} on`]) : "",
  choix ? tr([`${choix} choix`, `${choix} setting${choix > 1 ? "s" : ""}`]) : ""].filter(Boolean).join(" · ");
  return el("section", { class: "kn-theme" },
    el("div", { class: "kn-theme-tete" }, el("h3", { class: "kn-theme-nom" }, tr(titre)),
      el("span", { class: "kn-signaux" }, signaux), el("span", { class: "kn-compte" }, compte)),
    el("div", { class: "kn-theme-corps liste" }, ...cartes));
}

function kinitoOptions() {
  const fs = fonctionsDe("kinito");
  const opts = E.options.filter(o => o.kinito);
  if (!opts.length && !fs.length) return [el("div", { class: "vide neutre" }, t("kinitoVide"))];
  const vus = new Set();
  const carteOption = o => {   // option seule (sa fonction n'est pas dans la section), comme chez Alex
    vus.add("option:" + o.nom);
    const f = fonction(o.script);
    const c = el("div", { class: "carte" + (o.actuelle !== o.defaut ? " ecart" : "") }, blocOption(o, f ? f.actif : true));
    [...c.querySelectorAll(".segments")].forEach((s, i) => knMenu(s, `option:${o.nom}:${i}`));   // menu déroulant ici aussi
    return { carte: c };
  };
  const carte = nom => {
    if (nom.startsWith("option:")) { const o = option(nom.slice(7)); return o && o.kinito ? carteOption(o) : null; }
    const f = fs.find(x => x.nom === nom);
    if (!f) return null;
    vus.add(nom);
    for (const o of f.options) vus.add("option:" + o);
    return { carte: knReplier(carteFonction(f, true), nom, f), fonction: true, actif: !!f.actif };
  };
  const alex = typeof KINITO_GROUPES !== "undefined" ? KINITO_GROUPES : [];
  const groupes = [...alex, ...KN_PLUS.filter(([, n]) => !alex.some(([, m]) => n.every(x => m.includes(x))))];
  const out = [];
  for (const [titre, noms] of groupes) {
    const rangs = noms.map(carte).filter(Boolean);
    if (rangs.length) out.push(knTheme(titre, rangs));
  }
  // nouveautés pas encore rangées : à la fin
  const reste = [...fs.filter(f => !vus.has(f.nom)).map(f => f.nom), ...opts.filter(o => !vus.has("option:" + o.nom)).map(o => "option:" + o.nom)]
    .map(carte).filter(Boolean);
  if (reste.length) out.push(knTheme(["Autres", "Others"], reste));
  return out;
}
// --- fin Kinito ---
