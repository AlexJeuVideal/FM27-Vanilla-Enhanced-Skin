<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FM27 Vanilla Enhanced Skin</title>
<link rel="icon" href="/icone.ico" sizes="16x16 24x24 32x32 48x48 64x64 256x256">
<style>
  /* couleurs : --base = couleur du fond du skin, --bulle = couleur secondaire (infobulles) ; posées par theme() */
  :root {
    --nuit: #08111b;
    --base: #1d3b57;
    --bulle: #1c1d20;
    --fond: rgba(2, 6, 12, .45);
    --panneau: rgba(8, 14, 22, .74);
    --panneau-2: rgba(14, 21, 31, .9);
    --survol: rgba(255, 255, 255, .07);
    --bord: rgba(255, 255, 255, .09);
    --bord-fort: rgba(255, 255, 255, .17);
    --texte: #eef0f4;
    --texte-2: #bec4cf;
    --texte-3: #8d95a5;
    --vert: #35c07a;
    --vert-fond: rgba(53, 192, 122, .12);   /* vert : seulement les signaux « OK » (FM fermé, ✓) */
    /* violet du bouton « Continuer » de FM27 (ui-styles : --continue-button-default-*, --colours-base-purple-*) */
    --violet: #B145E3;
    --violet-clair: #D99FF4;
    --violet-fond: rgba(177, 69, 227, .16);
    --cta: linear-gradient(90deg, #A40FC7 0%, rgba(164, 15, 199, 0) 80%) #E50F51;
    --cta-survol: linear-gradient(90deg, #A40FC7 0%, rgba(164, 15, 199, 0) 80%) #F23670;
    --ambre: #f0a53a;
    --ambre-fond: rgba(240, 165, 58, .13);
    --rouge: #e5564e;
    --rouge-fond: rgba(229, 86, 78, .12);
    --rayon: 10px;
    --police: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --mono: "Cascadia Mono", Consolas, monospace;
  }
  /* v1.31 : polices Windows de chaque écriture (sinon le chinois peut sortir en glyphes japonais et inversement) */
  :root:lang(ja) { --police: "Segoe UI Variable Text", "Segoe UI", "Yu Gothic UI", "Meiryo UI", sans-serif; }
  :root:lang(zh) { --police: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; }
  :root:lang(ko) { --police: "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", sans-serif; }
  * { box-sizing: border-box; scrollbar-color: rgba(255, 255, 255, .2) transparent; scrollbar-width: thin; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--nuit); color: var(--texte); font: 14px/1.45 var(--police);
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  /* fond façon FM27 : bleu nuit en haut, la couleur du skin en bas, grandes courbes (dessiné par fondCss()) */
  .decor { position: fixed; inset: 0; z-index: -1; transition: background .3s; }
  .carte, .chiffre, .heros, nav, .grand-choix, .tache, dialog { backdrop-filter: blur(14px); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

  /* ---------- haut ---------- */
  .haut {
    height: 60px; display: flex; align-items: center; gap: 16px; padding: 0 20px;
    border-bottom: 1px solid var(--bord); background: var(--nuit);
    box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--violet) 60%, transparent);
  }
  .marque { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo { width: 36px; height: 36px; flex: none; display: block; }
  .nom-app { font-weight: 650; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nom-app small { color: var(--texte-3); font-weight: 500; margin-left: 6px; font-size: 12px; }
  .espace { flex: 1; }
  .pastille-fm {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px; font-size: 13px;
    background: var(--vert-fond); color: var(--vert); white-space: nowrap;
  }
  .pastille-fm::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pastille-fm.ouvert { background: var(--ambre-fond); color: var(--ambre); }
  .segments-langue { display: flex; background: var(--fond); border: 1px solid var(--bord); border-radius: 8px; padding: 2px; }
  .segments-langue button {
    border: 0; background: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; color: var(--texte-2);
    font-size: 12px; font-weight: 600;
  }
  .segments-langue button.choisi { background: var(--survol); color: var(--texte); }
  /* v1.31 : autres langues, dépliées par la petite flèche à côté de FR / EN */
  .langues { position: relative; }
  .segments-langue .plus-langues { display: flex; align-items: center; gap: 5px; padding: 4px 6px; }
  .plus-langues svg.fleche { width: 10px; height: 10px; transition: transform .15s; }
  .plus-langues[aria-expanded="true"] svg.fleche { transform: rotate(180deg); }
  .drapeau { display: inline-flex; flex: none; width: 18px; height: 12px; border-radius: 2px; overflow: hidden; box-shadow: 0 0 0 1px #0006; }
  .drapeau svg { width: 100%; height: 100%; display: block; }
  .menu-langues {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; min-width: 190px; padding: 4px;
    background: linear-gradient(var(--panneau-2), var(--panneau-2)), var(--nuit);   /* opaque : la page ne transparaît pas */
    border: 1px solid var(--bord-fort); border-radius: 10px; box-shadow: 0 10px 30px #0008;
  }
  .menu-langues button {
    display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 7px 10px;
    border-radius: 6px; cursor: pointer; text-align: left; color: var(--texte-2);
  }
  .menu-langues button:hover { background: var(--survol); color: var(--texte); }
  .menu-langues button.choisi { background: var(--violet-fond); color: var(--texte); }
  .menu-langues b { font-size: 12px; width: 22px; }
  .menu-langues .sep { height: 1px; background: var(--bord); margin: 4px 6px; }
  .autres-langues { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .autres-langues button {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--bord-fort); background: var(--panneau); color: var(--texte-2);
  }
  .autres-langues button:hover { background: var(--survol); color: var(--texte); }
  .autres-langues button.choisi { border-color: var(--violet); color: var(--texte); }
  .bouton {
    border: 1px solid var(--bord-fort); background: var(--panneau-2); padding: 7px 14px; border-radius: 8px;
    cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s;
  }
  .bouton:hover:not(:disabled) { background: var(--survol); }
  .bouton:disabled { opacity: .45; cursor: not-allowed; }
  .bouton.principal { background: var(--cta); border-color: transparent; color: #fff; font-weight: 650; }
  .bouton.principal:hover:not(:disabled) { background: var(--cta-survol); }
  .bouton.discret { background: none; border-color: transparent; color: var(--texte-2); }
  .bouton.discret:hover:not(:disabled) { color: var(--texte); background: var(--survol); }
  .bouton.danger { color: var(--rouge); }
  .carte.notes { padding: 6px 20px 16px; }
  .carte.notes h2 { font-size: 15px; margin: 18px 0 6px; text-transform: none; letter-spacing: 0; color: var(--texte); }
  .carte.notes p { margin: 8px 0 4px; color: var(--texte-2); }
  .carte.notes ul { margin: 4px 0; padding-left: 18px; }
  .carte.notes li { margin: 4px 0; line-height: 1.45; font-size: 13.5px; }
  .carte.notes li.sous { margin-left: 18px; list-style: circle; }
  .carte.notes code { font-size: 12.5px; }
  .lien {
    border: 0; background: none; padding: 0; color: var(--ambre); cursor: pointer; font-size: 12.5px;
    text-decoration: underline; text-underline-offset: 3px;
  }

  /* pseudo cliquable (titre de la section Kinito) : ouvre son lien dans le navigateur */
  .pseudo {
    border: 0; background: none; padding: 0; font: inherit; letter-spacing: inherit; text-transform: inherit;
    color: var(--violet-clair); cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  }
  .pseudo:hover { filter: brightness(1.25); }

  /* ---------- colonnes ---------- */
  .corps { display: flex; height: calc(100% - 60px); }
  nav {
    width: 280px; flex: none; border-right: 1px solid var(--bord); overflow-y: auto; padding: 14px 10px 24px;
    background: var(--panneau);
  }
  .nav-titre { color: var(--texte-3); font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; margin: 18px 10px 6px; }
  .nav-el {
    width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: none; text-align: left;
    padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--texte-2);
  }
  .nav-el:hover { background: var(--survol); color: var(--texte); }
  .nav-el.choisi { background: var(--survol); color: var(--texte); box-shadow: inset 3px 0 0 var(--violet); }
  .nav-el .txt { flex: 1; min-width: 0; }
  .nav-el .compte { font-size: 12px; color: var(--texte-3); font-variant-numeric: tabular-nums; }
  /* Photos des stades / Dépannage : bien visibles en haut du menu (demande du joueur, 2026-11-09) */
  .nav-cles { display: flex; flex-direction: column; gap: 6px; margin: 10px 0 4px; }
  .nav-el.cle { padding: 10px 12px; border: 1px solid var(--violet); background: var(--violet-fond); color: var(--texte); font-weight: 650; }
  .nav-el.cle:hover { background: var(--survol); }
  .nav-el.cle .ico { font-size: 17px; line-height: 1; flex: none; }
  /* v1.78 : page « Vrais noms » : bandeau énorme « ce n'est pas mon travail » (fix de FM Scout) */
  .pas-moi { border: 3px solid var(--rouge); background: var(--rouge-fond); border-radius: var(--rayon); padding: 22px 24px; margin: 6px 0 22px; text-align: center; }
  .pas-moi .gros { font-size: 30px; font-weight: 900; letter-spacing: .5px; color: var(--rouge); margin: 0 0 10px; line-height: 1.15; }
  .pas-moi .qui { font-size: 22px; font-weight: 800; margin: 0 0 10px; }
  .pas-moi p { margin: 0 auto 14px; max-width: 640px; }
  .pas-moi .verif-boutons { justify-content: center; }
  .point-ambre { width: 7px; height: 7px; border-radius: 50%; background: var(--ambre); flex: none; }
  .maj-nav { width: 16px; height: 16px; border-radius: 50%; background: var(--violet); color: #fff; flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; line-height: 1; }
  main { flex: 1; overflow-y: auto; padding: 28px 36px 140px; }
  .contenu { max-width: 920px; margin: 0 auto; }
  .contenu.contenu-large { max-width: 1500px; }   /* section Fiche joueur : aperçu + cartes côte à côte */
  .contenu:has(.section-couleur) { max-width: 1480px; }   /* page Couleurs : réglages en grille, jusqu'à 4 par ligne */
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 4px; letter-spacing: -.2px; }
  h2 { font-size: 15px; font-weight: 650; margin: 32px 0 12px; }
  .sous-titre { color: var(--texte-2); margin: 0 0 22px; }
  .option-aide { color: var(--texte-2); font-size: 12.5px; line-height: 1.45; margin: 8px 0 0; overflow-wrap: anywhere; white-space: pre-line; }
  main h1, main h2, main .sous-titre, .aide, .conseil { text-shadow: 0 1px 3px rgba(0, 0, 0, .45); }
  main h2 { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--texte-2); }
  /* groupes de la section Kinito (2026-11-09) */
  main h3.groupe-kinito { font-size: 14px; font-weight: 650; margin: 22px 0 10px; text-shadow: 0 1px 3px rgba(0, 0, 0, .45); }

  /* ---------- accueil ---------- */
  .heros {
    border: 1px solid var(--bord); border-radius: 14px; padding: 26px 28px; display: flex; gap: 24px; align-items: center;
    background: radial-gradient(120% 140% at 100% 0%, rgba(164, 15, 199, .16), transparent 55%), var(--panneau);
  }
  .heros h1 { font-size: 20px; }
  .heros p { color: var(--texte-2); margin: 4px 0 0; max-width: 520px; }
  .heros .bouton.principal { padding: 12px 22px; font-size: 15px; }
  .chiffres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 14px; }
  .chiffre { border: 1px solid var(--bord); background: var(--panneau); border-radius: var(--rayon); padding: 14px 16px; }
  .chiffre b { display: block; font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .chiffre span { color: var(--texte-2); font-size: 12.5px; }
  .chiffre.ambre b { color: var(--ambre); }
  /* coréen / japonais / chinois : coupure possible après chaque signe, la tuile se réduisait à 1 caractère de large */
  :root:lang(ko) .chiffre span, :root:lang(ja) .chiffre span, :root:lang(zh) .chiffre span { display: inline-block; min-width: 6em; }
  :root:lang(ko) body { word-break: keep-all; }   /* le coréen se coupe entre les mots */
  .chiffre .chemin { display: block; font-size: 12px; color: var(--texte-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
  .vide {
    border: 1px dashed var(--bord-fort); border-radius: var(--rayon); padding: 18px; color: var(--texte-2);
    display: flex; align-items: center; gap: 10px;
  }
  .vide::before { content: "✓"; color: var(--vert); font-weight: 700; }

  /* ---------- cartes ---------- */
  .liste { display: flex; flex-direction: column; gap: 10px; }
  .carte { border: 1px solid var(--bord); background: var(--panneau); border-radius: var(--rayon); }
  .carte.ecart { border-color: rgba(240, 165, 58, .45); }
  .carte-tete { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
  .carte-texte { flex: 1; min-width: 0; }
  .carte-titre { font-weight: 550; }
  .carte-ou { color: var(--texte-3); font-size: 12px; margin-top: 2px; }   /* où voir le changement en jeu */
  .carte-sous { color: var(--texte-3); font-size: 12.5px; margin-top: 2px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 8px;
    border-radius: 99px; white-space: nowrap;
  }
  .badge.ambre { background: var(--ambre-fond); color: var(--ambre); }
  .badge.gris { background: var(--survol); color: var(--texte-2); }
  .badge.rouge { background: var(--rouge-fond); color: var(--rouge); font-weight: 650; }
  .badge.vert { background: var(--vert-fond); color: var(--vert); }
  .badge.violet { background: var(--violet-fond); color: var(--violet-clair); font-weight: 650; }
  .carte.a-reinstaller { border-color: color-mix(in srgb, var(--violet) 50%, transparent); }
  .badge.ambre::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* interrupteur */
  .inter { position: relative; width: 40px; height: 22px; flex: none; border: 0; padding: 0; border-radius: 99px; background: var(--bord-fort); cursor: pointer; transition: background .15s; }
  .inter::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .inter[aria-checked="true"] { background: var(--violet); }
  .inter[aria-checked="true"]::after { transform: translateX(18px); }
  .inter:disabled { opacity: .45; cursor: not-allowed; }
  .inter.attente { animation: pulse 1s infinite; }
  .inter.attente:disabled { opacity: 1; cursor: progress; }
  @keyframes pulse { 50% { opacity: .5; } }

  /* options : segments */
  .option { border-top: 1px solid var(--bord); padding: 12px 16px 14px 70px; }
  .option-tete { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  /* options qui ne servent qu'avec l'en-tête de FM (2026-11-07) : groupe, replié et grisé avec la grande tuile */
  .groupe-entete > summary { cursor: pointer; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; list-style: none; }
  .groupe-entete > summary::-webkit-details-marker { display: none; }
  .groupe-entete > summary::before { content: "▸"; color: var(--texte-3); transition: transform .15s; }
  .groupe-entete[open] > summary::before { transform: rotate(90deg); }
  .groupe-entete > .option { padding: 12px 0 0 14px; margin-top: 12px; border-left: 2px solid var(--bord); border-top: 0; }
  .groupe-entete.sans-effet > .option { opacity: .55; }
  .option-titre { color: var(--texte-2); font-size: 12.5px; font-weight: 600; }
  .segments { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--fond); border: 1px solid var(--bord); border-radius: 9px; padding: 3px; }
  .segments button {
    border: 1px solid transparent; background: none; padding: 6px 12px; border-radius: 7px; cursor: pointer; color: var(--texte-2);
    display: inline-flex; align-items: center; gap: 7px; font-size: 13px;
  }
  .segments button:hover:not(:disabled) { color: var(--texte); background: var(--panneau-2); }
  .segments button.choisi { background: var(--panneau-2); color: var(--texte); border-color: var(--bord-fort); }
  .segments button.choisi.pas-base { border-color: rgba(240, 165, 58, .6); background: var(--ambre-fond); }
  .segments button:disabled { cursor: not-allowed; }
  .segments .de-base { font-size: 10.5px; color: var(--texte-3); border: 1px solid var(--bord-fort); border-radius: 4px; padding: 0 4px; }
  .coche { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--texte-3); flex: none; }
  .choisi .coche { border: 4px solid var(--violet); }
  .choisi.pas-base .coche { border-color: var(--ambre); }

  /* écarts (accueil) */
  .ecart-el { display: flex; align-items: center; gap: 14px; padding: 12px 16px; }
  .ecart-el + .ecart-el { border-top: 1px solid var(--bord); }
  .ecart-el .ou { color: var(--texte-3); font-size: 12px; }
  .ecart-el .val { margin-top: 3px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .ecart-el .base { color: var(--texte-3); }

  /* fond des pages */
  .fond-grille { display: grid; grid-template-columns: 1fr 300px; gap: 18px; }
  /* page Couleurs (2026-11-11, le joueur : « ces grandes listes de choix à droite » prennent trop de hauteur) : aperçu
     à gauche qui suit le défilement, réglages en grille de gauche à droite (jusqu'à 4 par ligne selon la place) */
  .fond-grille.large { grid-template-columns: minmax(240px, 340px) minmax(0, 1fr); align-items: start; }
  .fond-grille.large > :first-child { position: sticky; top: 12px; }
  .fond-grille.large > .carte { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 10px; align-content: start; }
  .fond-grille.large .ligne-couleur { border: 1px solid var(--bord); border-radius: 10px; padding: 12px; }
  .fond-grille.large .ligne-couleur.pleine, .fond-grille.large .boutons-section { grid-column: 1 / -1; }
  .section-couleur .fond-grille.large .boutons-section { flex-direction: row; flex-wrap: wrap; margin-top: 4px; }
  .apercu { border-radius: var(--rayon); border: 1px solid var(--bord); padding: 18px; min-height: 230px; position: relative; overflow: hidden; transition: background .2s; }
  .apercu .faux-bloc { background: rgba(0, 0, 0, .28); border-radius: 6px; height: 14px; margin-bottom: 10px; }
  .apercu .faux-carte { background: rgba(0, 0, 0, .22); border-radius: 8px; padding: 12px; margin-top: 16px; width: 62%; }
  .apercu .bulle { position: absolute; right: 18px; bottom: 18px; border-radius: 6px; padding: 10px 12px; font-size: 12px; color: #fff; box-shadow: 0 6px 20px rgba(0, 0, 0, .4); }
  .pastilles-couleur { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
  .pastilles-couleur button { width: 30px; height: 30px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; }
  .pastilles-couleur button.choisi { border-color: #fff; }
  .postes-ligne { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
  .poste-col { display: flex; flex-direction: column; align-items: stretch; gap: 3px; }
  .poste-case { position: relative; height: 34px; border-radius: 6px; border: 2px solid transparent; color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-align: center; cursor: pointer; overflow: hidden; white-space: nowrap; }
  .poste-case:hover { border-color: rgba(255, 255, 255, .6); }
  .poste-case.change { border-color: var(--ambre, #E0A030); }
  .poste-case input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }
  .poste-fm { border: 0; background: none; color: var(--texte-3); font: inherit; font-size: 11px; cursor: pointer; padding: 0; text-align: center; }
  .poste-fm:hover { color: var(--texte); }
  .poste-fm.base { cursor: default; opacity: .5; }
  .champ { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .champ input[type=text] { flex: 1; min-width: 0; background: var(--fond); border: 1px solid var(--bord-fort); color: var(--texte); border-radius: 8px; padding: 8px 10px; font: inherit; }
  .opacite { display: flex; align-items: center; gap: 10px; margin: 8px 0 0; flex-wrap: wrap; }
  .opacite input[type=range] { flex: 1; min-width: 120px; max-width: 260px; accent-color: var(--violet, #B145E3); }
  .opacite-titre { font-size: 13px; opacity: .8; }
  .opacite-val { font-variant-numeric: tabular-nums; min-width: 44px; font-size: 13px; }
  .champ input[type=color] { width: 40px; height: 36px; border: 1px solid var(--bord-fort); border-radius: 8px; background: var(--fond); padding: 2px; cursor: pointer; }
  .etiquette { font-size: 12.5px; color: var(--texte-2); font-weight: 600; margin-bottom: 6px; display: block; }
  .case { display: flex; gap: 8px; align-items: center; color: var(--texte-2); font-size: 13px; margin-bottom: 10px; cursor: pointer; }
  /* barres du haut et accent : aperçu façon FM27 */
  .apercu-barres { border-radius: var(--rayon); border: 1px solid var(--bord); overflow: hidden; background: #0D0E11; }
  .ap-barre { display: flex; align-items: center; gap: 14px; height: 46px; padding: 0 10px 0 12px; font-size: 13px; font-weight: 600; }
  .ap-barre .ecusson { width: 24px; height: 24px; border-radius: 6px; background: rgba(255, 255, 255, .85); flex: none; }
  .ap-barre .menu { opacity: .75; white-space: nowrap; }
  .ap-barre .menu.actif { opacity: 1; }
  .ap-barre .icone { width: 14px; height: 14px; border: 2px solid currentColor; border-radius: 50%; margin-left: auto; opacity: .8; flex: none; }
  .ap-continuer { padding: 7px 14px; border-radius: 6px; color: #fff; font-weight: 700; white-space: nowrap; border: 1px solid rgba(255, 255, 255, .35); }
  /* touche de couleur du club (2026-11-11, essai) : couche sous le contenu de la barre */
  .ap-barre { position: relative; }
  .ap-barre > * { position: relative; }
  .ap-barre > .ap-touche { position: absolute; inset: 0; pointer-events: none; }
  .segments.grille-touche { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; box-sizing: border-box; }
  .grille-touche button { flex-direction: column; justify-content: center; gap: 1px; padding: 6px 4px; min-height: 46px; text-align: center; }
  .grille-touche button .coche { display: none; }
  .grille-touche button b { font-size: 15px; line-height: 1.1; }
  .grille-touche button span.nom { font-size: 11.5px; line-height: 1.2; }
  .touche-regl { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 10px; align-items: center; margin-top: 10px; max-width: 420px; }
  .touche-regl input[type=range] { accent-color: var(--violet, #B145E3); }
  .touche-regl span { font-size: 13px; }
  .touche-regl .val { font-variant-numeric: tabular-nums; min-width: 40px; }
  .ap-liseret { height: 1px; background: #3B1A24; }   /* trait entre les barres, teinté par l'équipe : varie */
  .ap-barre2 { height: 24px; display: flex; align-items: center; justify-content: flex-end; padding: 0 14px; font-size: 11.5px; color: rgba(255, 255, 255, .9); }
  .ap-page { padding: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: #ddd; }
  .ap-onglet { padding: 5px 10px; border-bottom: 2px solid; }
  .ap-inter { width: 30px; height: 17px; border-radius: 9px; position: relative; flex: none; }
  .ap-inter::after { content: ""; position: absolute; right: 2px; top: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; }
  .ap-ligne { flex-basis: 100%; padding: 6px 8px; border-radius: 4px; }
  /* presets d'accent (sous les couleurs des barres) : le choix en cours reste encadré */
  .presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .preset { text-align: left; border: 1px solid var(--bord-fort); background: var(--panneau); border-radius: 10px; padding: 10px; cursor: pointer; color: var(--texte); font: inherit; display: flex; flex-direction: column; gap: 8px; }
  .preset:hover { border-color: var(--texte-3); }
  .preset.choisi { border-color: var(--violet); box-shadow: inset 0 0 0 1px var(--violet); background: var(--violet-fond); }
  .preset .mini { height: 54px; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid rgba(255, 255, 255, .08); }
  .preset .mini .b1 { height: 12px; display: flex; justify-content: flex-end; align-items: center; padding: 0 4px; }
  .preset .mini .b1 i { width: 18px; height: 6px; border-radius: 2px; }
  .preset .mini .b2 { height: 5px; }
  .preset .mini .pg { flex: 1; display: flex; align-items: flex-end; justify-content: space-between; padding: 5px; }
  .preset .mini .pg i { width: 16px; height: 9px; border-radius: 5px; }
  .preset .mini .pg b { width: 26px; height: 12px; border-radius: 3px; }
  .preset .mini .pg u { width: 22px; height: 18px; border-radius: 3px; padding: 2px; box-sizing: border-box; display: flex; margin-left: auto; margin-right: 6px; }
  .preset .mini .pg u span { flex: 1; border-radius: 1px; }
  .preset .nom { font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; gap: 6px; }
  .preset .nom small { color: var(--violet-clair); font-weight: 600; }
  .preset .nom span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* « Mes thèmes » : carte + petits boutons dessous (renommer, exporter, supprimer / sauvegarder) */
  .preset-perso { display: flex; flex-direction: column; gap: 6px; }
  .preset-perso .preset { flex: 1; }
  .preset-actions { display: flex; gap: 6px; }
  .preset-actions button { flex: 1; border: 1px solid var(--bord-fort); background: var(--panneau); color: var(--texte); border-radius: 8px; padding: 4px 0; cursor: pointer; font: inherit; font-size: 13px; }
  .preset-actions button:hover { border-color: var(--texte-3); }
  .mes-themes-tete { margin: 22px 0 10px; }
  .mes-themes-tete h3 { margin: 0 0 4px; font-size: 15px; }
  .boutons-themes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .champ.fm { opacity: .55; }
  #dlg-champ { width: 100%; box-sizing: border-box; margin: 0 0 14px; background: var(--panneau); border: 1px solid var(--bord-fort); color: var(--texte); border-radius: 8px; padding: 9px 10px; font: inherit; }
  /* page Couleurs : sommaire + sections numérotées, toutes construites pareil (titre, état, aperçu | réglages) */
  .nav-couleurs { display: flex; flex-direction: row; flex-wrap: wrap; gap: 8px; margin: 4px 0 22px; }
  .nav-couleurs a { white-space: nowrap; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--bord-fort); color: var(--texte-2); text-decoration: none; font-size: 13px; }
  .nav-couleurs a:hover { color: var(--texte); border-color: var(--texte-3); }
  .section-couleur { border: 1px solid var(--bord); border-radius: var(--rayon); background: var(--panneau); padding: 18px; margin-bottom: 22px; scroll-margin-top: 16px; }
  .section-couleur > .tete { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .section-couleur > .tete .num { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--violet-fond); color: var(--violet-clair); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .section-couleur > .tete h2 { margin: 2px 0 2px; }
  .section-couleur > .tete .sous-titre { margin: 0; }
  .section-couleur > .tete .etat-section { margin-left: auto; flex: none; }
  .section-couleur .carte { background: var(--fond); }
  .section-couleur .boutons-section { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  @media (max-width: 760px) { .section-couleur > .tete { flex-wrap: wrap; } .section-couleur > .tete .etat-section { margin-left: 38px; } }
  /* écran Tactiques : aperçu (bandeau, panneau avec terrain, remplaçants) */
  .apercu-tac { border-radius: var(--rayon); border: 1px solid var(--bord); overflow: hidden; background: #0D0E11; }
  .ap-tac-bandeau { display: flex; gap: 8px; align-items: center; padding: 8px 10px; font-size: 12px; color: #fff; }
  .ap-tac-bandeau span { padding: 4px 8px; border-radius: 4px; background: rgba(0, 0, 0, .25); border: 1px solid rgba(255, 255, 255, .15); white-space: nowrap; }
  .ap-tac-bande { display: flex; gap: 14px; padding: 6px 10px; font-size: 11.5px; color: rgba(255, 255, 255, .9); background: rgba(10, 15, 30, .2); }
  .ap-tac-corps { display: flex; gap: 10px; padding: 10px; }
  .ap-tac-panneau { width: 46%; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 8px; border: 1px solid; }
  .ap-tac-terrain { position: relative; height: 150px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, .25); overflow: hidden; }
  .ap-tac-terrain::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid rgba(255, 255, 255, .25); }
  .ap-tac-terrain::after { content: ""; position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border: 1px solid rgba(255, 255, 255, .25); border-radius: 50%; }
  .ap-tac-terrain i { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #F2C230; }
  .ap-tac-remp { font-size: 11px; color: #fff; border-radius: 4px; padding: 6px 8px; }
  .ap-tac-tableau { flex: 1; border-radius: 6px; background: #091115; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .ap-tac-tableau i { height: 10px; border-radius: 3px; background: rgba(255, 255, 255, .08); }
  /* tuiles et tableau de score : aperçu (tableau de score de base, deux tuiles dont une survolée) */
  .apercu-tuiles { border-radius: var(--rayon); border: 1px solid var(--bord); background: #0D0E11; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .ap-score { display: flex; gap: 4px; align-items: stretch; height: 34px; font-weight: 700; font-size: 13px; max-width: 100%; }
  .ap-sc-case { display: flex; align-items: center; justify-content: center; padding: 0 8px; border-radius: 2px; min-width: 34px; }
  .ap-sc-bande { display: flex; align-items: center; gap: 10px; padding-left: 10px; padding-right: 10px; border-radius: 2px; flex: 1; min-width: 0; justify-content: space-between; }
  .ap-sc-bande .ap-sc-case { height: 26px; }
  .ap-match { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; padding: 10px; border-radius: 8px; background: #11151F; }
  .ap-m-boutons { display: flex; gap: 2px; justify-content: flex-end; }
  .ap-m-boutons span { padding: 4px 10px; border-radius: 3px; font-size: 12px; border: 1px solid rgba(255,255,255,.12); }
  .ap-m-comm { text-align: center; padding: 5px 8px; border-radius: 20px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ap-m-eff { display: flex; gap: 3px; }
  .ap-m-eff span { flex: 1; min-width: 0; text-align: center; padding: 10px 0; border-radius: 4px; font-size: 11px; color: #fff; border: 1px solid rgba(255,255,255,.12); }
  .ap-tuiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ap-tuile { border-radius: 6px; border: 1px solid rgba(255, 255, 255, .2); padding: 10px; display: flex; flex-direction: column; gap: 7px; min-height: 96px; color: #fff; font-size: 12px; }
  .ap-tuile i { height: 9px; border-radius: 3px; background: rgba(255, 255, 255, .12); }
  .ligne-couleur { padding: 12px 0; border-top: 1px solid var(--bord); }
  .ligne-couleur:first-child { border-top: 0; padding-top: 0; }
  .ligne-couleur .aide { font-size: 12px; color: var(--texte-3); margin: -2px 0 8px; }
  .ligne-couleur .champ { margin: 0; }
  .ligne-couleur .case { margin-bottom: 8px; }

  /* ---------- tâche en cours ---------- */
  .tache {
    position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 140%); width: min(760px, calc(100% - 32px));
    background: color-mix(in srgb, var(--bulle) 94%, transparent); border: 1px solid var(--bord-fort); border-radius: 14px; box-shadow: 0 18px 50px rgba(0, 0, 0, .5);
    transition: transform .25s ease; z-index: 10;
  }
  .tache.visible { transform: translate(-50%, 0); }
  .tache-tete { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .rond { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--bord-fort); border-top-color: var(--violet); animation: tourne .8s linear infinite; flex: none; }
  .rond.ok { animation: none; border: 0; background: var(--vert); }
  .rond.erreur { animation: none; border: 0; background: var(--rouge); }
  @keyframes tourne { to { transform: rotate(360deg); } }
  .tache-titre { font-weight: 600; flex: 1; min-width: 0; }
  .tache-conseil { margin: 10px 16px 12px; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.45;
    background: color-mix(in srgb, var(--rouge) 14%, transparent); border: 1px solid color-mix(in srgb, var(--rouge) 45%, transparent); }
  .tache-ia { display: flex; align-items: center; gap: 12px; margin: 10px 16px 12px; font-size: 13px; line-height: 1.45; color: var(--texte-2); }
  .tache-ia[hidden] { display: none; }
  .tache-ia button { flex: none; }
  @media (max-width: 600px) { .tache-ia { flex-direction: column; align-items: flex-start; } }
  .tache-titre small { display: block; color: var(--texte-2); font-weight: 400; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .barre { height: 4px; background: var(--bord); margin: 0 16px; border-radius: 99px; overflow: hidden; }
  .barre i { display: block; height: 100%; width: 0; background: var(--cta); transition: width .4s; }
  .barre-stades { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .barre-stades[hidden] { display: none; }
  .barre-stades .barre { height: 8px; margin: 0; }
  .barre i.indetermine { width: 30% !important; animation: va-vient 1.3s ease-in-out infinite alternate; }
  @keyframes va-vient { from { margin-left: 0; } to { margin-left: 70%; } }
  .journal { margin: 12px 16px 16px; max-height: 240px; overflow: auto; background: var(--fond); border: 1px solid var(--bord); border-radius: 8px; padding: 10px 12px; font: 12px/1.5 var(--mono); color: var(--texte-2); white-space: pre-wrap; display: none; }
  .tache.detail .journal { display: block; }

  .avis { position: fixed; top: 74px; left: 50%; transform: translate(-50%, -20px); opacity: 0; pointer-events: none; background: var(--ambre); color: #1b1203; padding: 9px 16px; border-radius: 9px; font-weight: 600; transition: .2s; z-index: 20; max-width: 90%; }
  .avis.visible { opacity: 1; transform: translate(-50%, 0); }

  dialog { background: var(--bulle); color: var(--texte); border: 1px solid var(--bord-fort); border-radius: 14px; padding: 22px 24px; max-width: 460px; box-shadow: 0 20px 60px rgba(0, 0, 0, .6); }
  dialog::backdrop { background: rgba(0, 0, 0, .55); }
  dialog h3 { margin: 0 0 8px; font-size: 16px; }
  dialog p { color: var(--texte-2); margin: 0 0 18px; }
  .boutons { display: flex; justify-content: flex-end; gap: 8px; }

  /* ---------- assistant d'installation ---------- */
  body.en-assistant nav, body.en-assistant #langues { display: none; }
  body.en-assistant main { padding-top: 40px; }
  .assistant { max-width: 760px; margin: 0 auto; }
  .rail { list-style: none; padding: 0; margin: 0 0 36px; display: flex; gap: 6px; }
  .rail li { flex: 1; display: flex; align-items: center; gap: 8px; color: var(--texte-3); font-size: 12.5px; font-weight: 600; padding-top: 10px; border-top: 3px solid var(--bord); }
  .rail li.faite { color: var(--texte-2); border-top-color: var(--violet); }
  .rail li.en-cours { color: var(--texte); border-top-color: var(--violet); }
  .rail .num { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--panneau-2); border: 1px solid var(--bord-fort); font-size: 11.5px; flex: none; }
  .rail li.faite .num { background: var(--violet-fond); color: var(--violet-clair); border-color: transparent; }
  .rail li.en-cours .num { background: var(--cta); color: #fff; border-color: transparent; }
  .pas h1 { font-size: 26px; margin-bottom: 8px; }
  .pas .sous-titre { font-size: 14.5px; max-width: 620px; }
  .pas-sur { color: var(--violet-clair); font-size: 12.5px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 10px; }
  .pas-bas { display: flex; justify-content: space-between; align-items: center; margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--bord); }
  .grands-choix { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grand-choix { text-align: left; border: 1px solid var(--bord-fort); background: var(--panneau); border-radius: 12px; padding: 22px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; transition: border-color .12s, background .12s; }
  .grand-choix:hover { border-color: var(--texte-3); background: var(--panneau-2); }
  .grand-choix.choisi { border-color: var(--violet); box-shadow: inset 0 0 0 1px var(--violet); background: var(--violet-fond); }
  .grand-choix b { font-size: 17px; }
  .grand-choix span { color: var(--texte-2); font-size: 13px; }
  .bouton.grand { padding: 12px 22px; font-size: 15px; }
  .erreur { color: var(--rouge); margin: 0 0 12px; }
  .aide { color: var(--texte-3); font-size: 12.5px; margin: 6px 0 0; }
  .autres-plateformes summary { cursor: pointer; color: var(--texte-2); width: fit-content; }
  .autres-plateformes summary:hover { color: var(--texte); }
  .autres-plateformes ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; overflow-wrap: anywhere; }
  .carte.alerte { border-color: rgba(229, 86, 78, .5); background: var(--rouge-fond); padding: 16px 18px; margin-top: 18px; }
  .carte.alerte b { display: block; margin-bottom: 6px; }
  .carte.alerte ol { margin: 8px 0 12px; padding-left: 20px; line-height: 1.6; }
  .carte.alerte.forte { border: 2px solid var(--rouge); background: rgba(229, 86, 78, .2); padding: 20px 22px; }
  .carte.alerte.forte b { color: var(--rouge); font-size: 18px; margin-bottom: 10px; }
  /* mise à jour de l'app (GitHub) : violet du bouton « Continuer » de FM */
  .carte.maj { border-color: color-mix(in srgb, var(--violet) 50%, transparent); background: var(--violet-fond); padding: 14px 18px; margin-bottom: 14px;
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .carte.maj .maj-texte { flex: 1; min-width: 240px; }
  .carte.maj b { display: block; margin-bottom: 2px; }
  .carte.maj details { margin-top: 6px; font-size: 12.5px; color: var(--texte-2); }
  .carte.maj pre { white-space: pre-wrap; font: inherit; margin: 6px 0 0; max-height: 220px; overflow: auto; }
  /* démarrage : chargement (recherche de MAJ), puis page « mise à jour » ou l'app ; au-dessus de tout */
  .demarrage { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 24px 16px; overflow: auto;
    background: radial-gradient(ellipse at 50% 120%, color-mix(in srgb, var(--violet) 22%, var(--nuit)), var(--nuit) 65%);
    transition: opacity .35s ease; }
  .demarrage.parti { opacity: 0; pointer-events: none; }
  .dem-charge { display: flex; flex-direction: column; align-items: center; gap: 18px; color: var(--texte-2); }
  .dem-charge img { width: 84px; height: 84px; border-radius: 18px; }
  .dem-charge .rond { width: 26px; height: 26px; border-width: 3px; }
  .dem-maj { width: min(620px, 100%); display: flex; flex-direction: column; gap: 14px; }
  .dem-maj .dem-tete { display: flex; align-items: center; gap: 14px; }
  .dem-maj .dem-tete img { width: 56px; height: 56px; border-radius: 12px; flex: none; }
  .dem-maj h1 { margin: 0; font-size: 22px; }
  .dem-maj .sous { color: var(--texte-2); margin: 2px 0 0; }
  .dem-maj .carte.alerte.forte { margin: 0; }
  .dem-maj .carte.alerte.forte p { margin: 0; }
  .dem-maj .garde { color: var(--texte-2); font-size: 13px; margin: 0; }
  .dem-maj .notes { padding: 12px 16px; }
  .dem-maj .notes b { display: block; margin-bottom: 6px; }
  .dem-maj .notes pre { white-space: pre-wrap; font: inherit; font-size: 13px; color: var(--texte-2); margin: 0; max-height: 200px; overflow: auto; }
  .dem-maj .boutons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .redemarrage { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(2, 6, 12, .8); z-index: 50; color: var(--texte-2); }
  .carte.alerte.forte .aide { margin: 0 0 14px; color: inherit; font-size: 13px; opacity: .85; }
  .bouton.rouge { background: var(--rouge); border-color: var(--rouge); color: #fff; font-weight: 650; }
  .bouton.rouge:hover { filter: brightness(1.1); }
  .conseil { border-left: 3px solid var(--bord); padding: 2px 0 2px 12px; color: var(--texte-2, var(--texte-3)); font-size: 13px; margin: 0 0 18px; }
  .chemin-carte { padding: 16px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .chemin-carte .etiquette { margin: 0; }
  .chemin-val { font: 13px var(--mono); color: var(--texte); word-break: break-all; }
  .chemin-val.ok::before { content: "✓  "; color: var(--vert); }
  /* page Photos des stades (2026-10-30) : état de l'installation, tuto numéroté, problèmes fréquents */
  .verif { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .verif.bon { border-color: color-mix(in srgb, var(--vert) 45%, transparent); }
  .verif-tete { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .verif-tete h2 { margin: 0 0 2px; }

const JETON = "__JETON__";

// ---------- textes ----------
const TXT = {

  trChargeTxt: ["Lance FM, ouvre une page club, ferme FM complètement, puis « Vérifier mon installation ». Si ça ne bouge pas, demande sur le Discord avec une capture de cette page.",
                "Start FM, open a club page, fully close FM, then « Check my setup ». If nothing changes, ask on the Discord with a screenshot of this page."],
  trTutoTitre: ["Installer les images, pas à pas", "Installing the images, step by step"],
  trTuto: [[
    "Installer la Salle des trophées",
    "Installe le skin depuis l'accueil (ou au moins « Salle des trophées », catégorie Club). FM doit être fermé. La première ligne de « Ton installation » doit être verte.",
    "Télécharger le pack",
    "Le bouton ouvre MEGA dans ton navigateur : télécharge le pack (fichier dont le nom commence par FMVE Trophies). Tu peux aussi prendre un pack de trophées d'un autre site (sortitoutsi, FM Scout…) : tout pack dont le config.xml contient des lignes to=\"graphics/pictures/comp/<numéro>/trophy\" marche, en plus du nôtre ou à sa place : décompresse-le dans son propre dossier de graphics, jamais dans le dossier FMVE.",
    "Ouvrir ton dossier graphics",
    "C'est le dossier de FM 27 qui reçoit les packs (logos, visages, stades). Le bouton l'ouvre (et le crée s'il n'existe pas encore). Glisse le fichier du pack dedans.",
    "Décompresser le pack au bon endroit",
    "Dans graphics, clic droit sur le fichier du pack puis « Extraire ici » (WinRAR ou 7-Zip). Il faut UN SEUL dossier FMVE Trophies, avec les images directement dedans. Ensuite tu peux supprimer le fichier du pack.",
    "Images dans un dossier en trop à l'intérieur de FMVE Trophies ? Pas grave : à l'étape suivante, l'app les remet en place. Un dossier qui n'a pas FMVE dans son nom (ancien pack de FM 24 « trophies »…), l'app n'y touche jamais : mets ses images toi-même dans FMVE Trophies (le nom <numéro>.png marche tel quel).",
    "Laisser l'app tout mettre en place, puis relancer FM",
    "Rien à faire : l'app prépare toute seule le config.xml (installation du skin, ouverture de l'app, puis toutes les 2 minutes, FM fermé). « Vérifier mon installation » le fait tout de suite : tout doit être vert en haut de la page. Ferme FM complètement puis relance-le et ouvre la page d'un club (Vue d'ensemble). Une compétition sans image dans le pack garde une carte sans image (jamais le logo de la compétition) : c'est normal.",
  ], [
    "Install the Trophy Room",
    "Install the skin from the home page (or at least « Trophy Room », Club category). FM must be closed. The first line of « Your setup » must be green.",
    "Download the pack",
    "The button opens MEGA in your browser: download the pack (file whose name starts with FMVE Trophies). You can also use a trophy pack from another site (sortitoutsi, FM Scout…): any pack whose config.xml has lines to=\"graphics/pictures/comp/<number>/trophy\" works, on top of ours or instead of it: extract it in its own graphics folder, never inside the FMVE folder.",
    "Open your graphics folder",
    "It is the FM 27 folder that holds packs (logos, faces, stadiums). The button opens it (and creates it if it does not exist yet). Drag the pack's file into it.",
    "Extract the pack in the right place",
    "In graphics, right-click the pack's file then « Extract here » (WinRAR or 7-Zip). You need ONE single FMVE Trophies folder, with the images directly inside. You can then delete the pack's file.",
    "Images in one folder too many inside FMVE Trophies? No problem: at the next step, the app puts them back in place. A folder without FMVE in its name (old FM 24 « trophies » pack…) is never touched by the app: put its images into FMVE Trophies yourself (the <number>.png name works as it is).",
    "Let the app set everything up, then restart FM",
    "Nothing to do: the app prepares the config.xml on its own (skin install, app opening, then every 2 minutes, FM closed). « Check my setup » does it right away: everything at the top of the page must be green. Fully close FM, start it again and open a club page (Overview). A competition with no image in the pack keeps a card without an image (never the competition's logo): that is normal.",
  ]],
  trFaq: [[
    "L'app supprime-t-elle mes fichiers ?",
    "Non. Elle réécrit seulement le config.xml de FMVE Trophies et refait ses propres liens dans « FMVE Trophies Links » (des liens, pas des copies : effacer un lien n'efface pas la photo). Une vraie image posée par erreur dans « FMVE Trophies Links » est remise dans FMVE Trophies. Tout ce qu'elle doit déplacer va dans « graphics (mis de côté) », à côté de graphics : rien n'est jamais effacé. Les dossiers qui n'ont pas « FMVE » dans leur nom (packs d'autres sites, tes dossiers à toi) sont seulement lus.",
    "Une compétition n'a pas d'image",
    "Tes packs n'ont pas tous les trophées. Sans image, FM mettrait le logo de la compétition à la place : le skin pose une image vide, la carte garde juste son nom et son nombre de victoires. Pour ajouter ton trophée : une image TROPHY<numéro de la compétition>.png dans FMVE Trophies (le numéro est celui de la compétition dans l'éditeur de FM). C'est pris tout seul (FM fermé, 2 minutes au plus, ou tout de suite avec « Vérifier mon installation »), puis relance FM.",
    "Je veux utiliser un pack de trophées d'un autre site",
    "Décompresse-le dans graphics, dans SON PROPRE dossier (à côté de FMVE Trophies, jamais dedans : l'app réécrit le config.xml de FMVE Trophies), avec son config.xml (sortitoutsi, FM Scout…). Rien d'autre à faire : l'app le trouve toute seule (FM fermé, 2 minutes au plus, ou tout de suite avec « Vérifier mon installation »). Un trophée présent dans deux packs : celui de l'autre site passe devant FMVE Trophies.",
    "Jupiler Pro League, 3F Superliga, Betinia Liga… sans image",
    "Leurs numéros (1 à 7) sont aussi ceux des continents, et FM garde ses propres logos de continents à ces numéros : impossible d'y mettre un trophée (essayé). Ces cartes restent donc sans image, avec leur nom et leur nombre de victoires.",
    "Je préfère les Actualités",
    "Désactive « Salle des trophées » dans la catégorie Club (FM fermé) : les Actualités reviennent.",
    "J'ajoute mes propres images à la main",
    "Le plus sûr : ton propre dossier dans graphics, SANS « FMVE » dans son nom (ex. « Mes trophées »), avec tes images et un config.xml : une ligne par image, from=« nom de l'image sans extension », to=« graphics/pictures/comp/<numéro>/trophy » (même format que les packs d'internet). L'app ne modifie jamais ce dossier, il passe devant FMVE Trophies et il ne bouge pas quand tu mets à jour notre pack. Sinon : pose TROPHY<numéro>.png dans FMVE Trophies. C'est pris tout seul (FM fermé, 2 minutes au plus, ou tout de suite avec « Vérifier mon installation »), puis relance FM.",
    "J'ai sauté des mises à jour de l'app, ou j'ai un ancien pack de trophées",
    "Pas besoin de retélécharger le pack ni de toucher à tes fichiers : installe juste la dernière version de l'app (mise à jour depuis l'app, ou le nouveau Setup) et garde ton dossier FMVE Trophies tel quel. À l'ouverture, l'app reconnaît l'ancien format d'après les fichiers : soit elle le met à jour toute seule, soit elle affiche une fenêtre « Convertir » (un clic). Rien n'est supprimé : une image en double est rangée dans « graphics (mis de côté) ». Puis relance FM.",
  ], [
    "Does the app delete my files?",
    "No. It only rewrites the FMVE Trophies config.xml and rebuilds its own links in « FMVE Trophies Links » (links, not copies: deleting a link does not delete the photo). A real image put in « FMVE Trophies Links » by mistake is moved back into FMVE Trophies. Anything it has to move goes to « graphics (mis de côté) », next to graphics: nothing is ever deleted. Folders without « FMVE » in their name (other sites' packs, your own folders) are only read.",
    "A competition has no image",
    "Your packs don't have every trophy. With no image, FM would show the competition's logo instead: the skin puts an empty image there, so the card just keeps its name and number of wins. To add your trophy: a TROPHY<competition number>.png image in FMVE Trophies (the number is the competition's one in FM's editor). It is picked up on its own (FM closed, 2 minutes at most, or right away with « Check my setup »), then restart FM.",
    "I want to use a trophy pack from another site",
    "Extract it into graphics, in ITS OWN folder (next to FMVE Trophies, never inside it: the app rewrites the FMVE Trophies config.xml), with its config.xml (sortitoutsi, FM Scout…). Nothing else to do: the app finds it on its own (FM closed, 2 minutes at most, or right away with « Check my setup »). A trophy in two packs: the other site's one goes before FMVE Trophies.",
    "Jupiler Pro League, 3F Superliga, Betinia Liga… without an image",
    "Their numbers (1 to 7) are also the continents' ones, and FM keeps its own continent logos at those numbers: no trophy can go there (tried). These cards stay without an image, with their name and number of wins.",
    "I prefer the News",
    "Turn off « Trophy Room » in the Club category (FM closed): the News come back.",
    "I add my own images by hand",
    "Safest: your own folder in graphics, WITHOUT « FMVE » in its name (e.g. « My trophies »), with your images and a config.xml: one line per image, from=« image name without extension », to=« graphics/pictures/comp/<number>/trophy » (same format as the internet packs). The app never changes that folder, it goes before FMVE Trophies and it stays as it is when you update our pack. Otherwise: put TROPHY<number>.png in FMVE Trophies. It is picked up on its own (FM closed, 2 minutes at most, or right away with « Check my setup »), then restart FM.",
    "I skipped app updates, or I have an old trophy pack",
    "No need to download the pack again or to touch your files: just install the latest app version (update from the app, or the new Setup) and keep your FMVE Trophies folder as it is. When it opens, the app recognises the old format from the files: either it updates it on its own, or it shows a « Convert » window (one click). Nothing is deleted: a duplicate image is put in « graphics (mis de côté) ». Then restart FM.",
  ]],

  // page Dépannage (v1.53)
  dpTitre: ["Dépannage", "Troubleshooting"],
  dpSous: ["Le skin modifie des fichiers de FM : presque tous les soucis viennent d'une installation coupée, d'un jeu pas propre ou d'une mise à jour de FM. Lis cette page avant d'installer, et suis-la à la lettre en cas de problème.",
           "The skin changes FM's files: almost every issue comes from an interrupted install, a game that isn't clean or an FM update. Read this page before installing, and follow it to the letter if something goes wrong."],
  dpJamaisTitre: ["Précautions : à respecter à CHAQUE installation", "Precautions: follow them on EVERY install"],
  dpJamais: [[
    "Quitte FM complètement avant d'installer, de désinstaller ou de changer une fonction (Quitter le jeu, pas juste revenir au menu). En haut de l'app, il doit être écrit « FM fermé ».",
    "Ne lance JAMAIS FM pendant qu'une tâche tourne dans l'app. Attends la fin et le message de réussite.",
    "Ne ferme pas l'app, ne mets pas le PC en veille et ne l'éteins pas pendant une tâche : une installation coupée laisse des fichiers à moitié écrits.",
    "Ne lance pas en même temps une mise à jour ou une « vérification des fichiers » de Steam.",
    "Un seul skin à la fois : pas d'autre skin ni de mod d'interface dans FM 27. Si tu en avais un, remets les fichiers d'origine (vérification Steam) AVANT d'installer celui-ci.",
    "Ne touche pas à la main aux fichiers du jeu ni au dossier de l'app (surtout « backups » : il garde les fichiers d'origine de FM). Ne déplace pas et ne renomme pas le dossier de l'app.",
    "N'ouvre l'app qu'une seule fois (une seule fenêtre).",
    "Si Windows ou ton antivirus bloque l'app ou Python, autorise-les puis relance la tâche : ne coupe rien en plein milieu.",
  ], [
    "Quit FM completely before installing, uninstalling or changing a feature (Quit game, not just back to the menu). At the top of the app, it must say « FM closed ».",
    "NEVER start FM while a task is running in the app. Wait for the end and the success message.",
    "Don't close the app, don't put the PC to sleep and don't shut it down during a task: an interrupted install leaves half-written files.",
    "Don't run a Steam update or « verify files » at the same time.",
    "One skin at a time: no other skin or UI mod in FM 27. If you had one, restore the original files (Steam verify) BEFORE installing this one.",
    "Don't touch the game files or the app folder by hand (especially « backups »: it keeps FM's original files). Don't move or rename the app folder.",
    "Open the app only once (a single window).",
    "If Windows or your antivirus blocks the app or Python, allow them and run the task again: don't stop anything halfway.",

  dpMajTitre: ["Après une mise à jour de FM (Steam)", "After an FM update (Steam)"],
  dpMaj: ["Une mise à jour de FM remplace une partie des fichiers du skin. Au démarrage, l'app le voit et te propose de réinstaller le skin : fais-le AVANT de jouer, FM fermé. Si l'app dit que cette version de FM n'est pas encore prise en charge, attends la mise à jour du skin (l'app te la proposera toute seule) au lieu de forcer.",
          "An FM update replaces part of the skin's files. At launch, the app sees it and offers to reinstall the skin: do it BEFORE playing, with FM closed. If the app says this FM version isn't supported yet, wait for the skin update (the app will offer it by itself) instead of forcing it."],
  dpCrashTitre: ["FM plante ou affiche des choses bizarres", "FM crashes or shows weird things"],
  dpCrashSous: ["Fais les étapes dans l'ordre, sans en sauter : elles disent si le souci vient du skin ou d'autre chose.",
                "Do the steps in order, without skipping any: they tell whether the issue comes from the skin or from something else."],
  dpCrash: [[
    "Ferme FM et désinstalle tout le skin",
    "Le bouton coupe toutes les fonctions et remet les fichiers d'origine de FM (tes options sont gardées).",
    "Vérifie les fichiers du jeu dans Steam",
    "Steam : clic droit sur Football Manager 27, Propriétés, Fichiers installés, « Vérifier l'intégrité des fichiers du jeu ». Attends la fin complète.",
    "Lance FM SANS le skin",
    "Si ça plante encore : ce n'est pas le skin (sauvegarde, autre mod, pack de graphics…). Sors aussi tes packs de graphics (logos, visages, stades) pour tester.",
    "Réinstalle le skin",
    "Si FM marche sans le skin : ferme-le, réinstalle le skin (« Installer tout le skin » sur l'accueil, ou tes fonctions une par une), attends la fin, puis relance FM.",
    "Ça replante ? Trouve la fonction en cause",
    "Désactive les fonctions une par une (pages de gauche), FM fermé à chaque fois, jusqu'à ce que ça ne plante plus. Puis fais un report (en bas de cette page) en disant laquelle.",
  ], [
    "Close FM and uninstall the whole skin",
    "The button turns every feature off and puts FM's original files back (your options are kept).",
    "Verify the game files in Steam",
    "Steam: right-click Football Manager 27, Properties, Installed Files, « Verify integrity of game files ». Wait until it fully ends.",

  ]],
  dpDispoTitre: ["Une page de FM n'a pas changé ?", "An FM page didn't change?"],
  dpDispo: ["Si tu as réorganisé cette page toi-même dans FM (tuiles déplacées ou ajoutées), ta disposition perso passe avant le skin. Remets la disposition par défaut de cette page dans FM, puis relance le jeu.",
            "If you rearranged that page yourself in FM (tiles moved or added), your custom layout overrides the skin. Reset that page's layout to default in FM, then restart the game."],
  dpLogsTitre: ["Les journaux (logs)", "The logs"],
  dpJournalTitre: ["Journal de l'app : « Journal - Log.txt »", "App log: « Journal - Log.txt »"],
  dpJournal: ["Dans le dossier de l'app. À chaque ouverture, l'app y écrit sa version, Windows, la version de FM, les fonctions activées et les options. Puis chaque action (installer, désinstaller, activer…) et son résultat, réussite ou erreur. C'est LE fichier à joindre à un report. Il se raccourcit tout seul quand il devient trop long.",
              "In the app folder. Each time it opens, the app writes its version, Windows, the FM version, the enabled features and the options. Then every action (install, uninstall, enable…) and its result, success or error. It is THE file to attach to a report. It shortens itself when it gets too long."],
  dpTacheTitre: ["Pendant une tâche", "During a task"],
  dpTache: ["Le détail s'affiche en direct dans l'app. Si la tâche finit en erreur, un bouton « Copier l'erreur pour l'IA » copie l'erreur avec tout son contexte : colle-la dans une IA (ChatGPT, Claude…) ou sur le Discord.",
            "The details show live in the app. If the task ends in an error, a « Copy the error for the AI » button copies the error with all its context: paste it into an AI (ChatGPT, Claude…) or on the Discord."],
  dpLogsFmTitre: ["Logs de FM : Player.log", "FM logs: Player.log"],
  dpLogsFm: ["FM écrit les siens dans AppData\\LocalLow\\Sports Interactive\\Football Manager 27 : Player.log pour le dernier lancement, Player-prev.log pour celui d'avant. Après un crash, récupère Player.log AVANT de relancer FM (sinon il devient Player-prev.log, puis il est effacé au lancement suivant).",
             "FM writes its own in AppData\\LocalLow\\Sports Interactive\\Football Manager 27: Player.log for the last run, Player-prev.log for the one before. After a crash, grab Player.log BEFORE starting FM again (otherwise it becomes Player-prev.log, then it is deleted at the next launch)."],
  dpOuvrirJournal: ["Ouvrir le journal", "Open the log"],
  dpOuvrirApp: ["Ouvrir le dossier de l'app", "Open the app folder"],

  dpLicenceTitre: ["Licence et crédits", "License and credits"],
  dpLicence: ["L'app est sous licence MIT (AlexJeuVideal et Kinito ; moteur rapide : TonyBoy) : libre de l'utiliser, la modifier et la partager, en gardant la licence et les noms. Football Manager et ses fichiers restent à Sports Interactive / SEGA.",

  dpMerci: ["Merci à TonyBoy (FM27 Turbo) pour le moteur rapide, à AlexMorak pour le pack d'images, à FM Scout pour le fix des vrais noms, et à Jouz et Dhragga pour les premiers tests sur Mac.",

  reconfigFait: ["FMVE Stadium refait ({n} photo(s) remontée(s)). {c} conflit(s) possible(s) dans les autres packs (listés ci-dessous, jamais modifiés par l'app), puis relance FM.",

  verifScanRienTxt: ["Si FM a bien été relancé : FM fermé, sors tous les autres dossiers de graphics, supprime FMVE Stadium et redécompresse le pack propre (étape 4). Vérifie que les photos s'affichent, puis remets tes autres dossiers un par un en relançant FM : celui après lequel elles disparaissent est le coupable (dis-nous lequel sur le Discord).",
                     "If FM was restarted: with FM closed, move all the other folders out of graphics, delete FMVE Stadium and extract the pack again cleanly (step 4). Check the photos show, then put your other folders back one by one, restarting FM each time: the one after which they disappear is the culprit (tell us which one on the Discord)."],

  verifBloqueTxt: ["Souvent la « Protection contre les ransomwares » (Sécurité Windows > Protection contre les virus > Gérer la protection contre les ransomwares) ou un antivirus : autorise l'app (Python) ou désactive l'accès contrôlé aux dossiers, puis « Vérifier mon installation ».",
                   "Usually « Ransomware protection » (Windows Security > Virus protection > Manage ransomware protection) or an antivirus: allow the app (Python) or turn off controlled folder access, then « Check my setup »."],

  stTutoTitre: ["Installer les photos, pas à pas", "Installing the photos, step by step"],
  stTuto: [[
    "Installer le skin",
    "Installe le skin depuis l'accueil (ou au moins « Panneau du bas en 3 colonnes », catégorie Club). FM doit être fermé. La première ligne de « Ton installation » doit être verte.",
    "Télécharger le pack",
    "Le bouton ouvre MEGA dans ton navigateur : télécharge le pack (fichier .rar dont le nom commence par FMVE Stadium ; gros fichier, c'est normal que ce soit long). Tu peux aussi prendre un pack de stades d'un autre site (sortitoutsi, FM Scout…) : tout pack dont le config.xml contient des lignes to=\"graphics/pictures/stadium/<numéro>/background\" marche, en plus du nôtre ou à sa place : décompresse-le dans son propre dossier de graphics, jamais dans le dossier FMVE.",
    "Ouvrir ton dossier graphics",
    "C'est le dossier de FM 27 qui reçoit les packs (logos, visages, stades). Le bouton l'ouvre (et le crée s'il n'existe pas encore). Glisse le .rar du pack dedans.",
    "Décompresser le pack au bon endroit",
    "Dans graphics, clic droit sur le .rar du pack puis « Extraire ici » (WinRAR ou 7-Zip ; sous Windows 11 : « Extraire tout », puis efface la fin du chemin proposé, à partir de « \\FMVE Stadium », pour qu'il finisse par « \\graphics » avant de valider).",
    "Il faut UN SEUL dossier FMVE Stadium, avec les photos directement dedans. Ensuite tu peux supprimer le .rar.",
    "Les photos sont dans un dossier en trop ? Pas grave : à l'étape suivante, l'app le voit et propose « Réparer automatiquement ».",
    "Laisser l'app tout mettre en place",
    "Rien à faire : l'app prépare toute seule le config.xml qui dit à FM où trouver chaque photo, à l'installation du skin, à chaque ouverture de l'app et toutes les 2 minutes tant qu'elle reste ouverte (FM fermé). « Vérifier mon installation » le fait tout de suite et contrôle tout. Tout doit être vert en haut de la page. Si Windows ou ton antivirus bloque l'app, la marche à suivre est dans « Problèmes fréquents » plus bas.",
    "Relancer FM",
    "Ferme FM complètement (Quitter le jeu, pas juste revenir au menu), puis relance-le et ouvre la page d'un club (Vue d'ensemble). Un club sans photo dans le pack garde le stade générique aux couleurs du club : c'est normal.",
  ], [
    "Install the skin",
    "Install the skin from the home page (or at least « Bottom panel in 3 columns », Club category). FM must be closed. The first line of « Your setup » must be green.",
    "Download the pack",
    "The button opens MEGA in your browser: download the pack (.rar file whose name starts with FMVE Stadium; big file, it is normal that it takes a while). You can also use a stadium pack from another site (sortitoutsi, FM Scout…): any pack whose config.xml has lines to=\"graphics/pictures/stadium/<number>/background\" works, on top of ours or instead of it: extract it in its own graphics folder, never inside the FMVE folder.",
    "Open your graphics folder",
    "It is the FM 27 folder that holds packs (logos, faces, stadiums). The button opens it (and creates it if it does not exist yet). Drag the pack's .rar into it.",
    "Extract the pack in the right place",
    "In graphics, right-click the pack's .rar then « Extract here » (WinRAR or 7-Zip; on Windows 11: « Extract all », then delete the end of the suggested path, from « \\FMVE Stadium » on, so that it ends with « \\graphics » before confirming).",
    "You need ONE single FMVE Stadium folder, with the photos directly inside. You can then delete the .rar.",
    "Photos in one folder too many? No problem: at the next step, the app spots it and offers « Fix it automatically ».",
    "Let the app set everything up",
    "Nothing to do: the app prepares on its own the config.xml that tells FM where to find each photo, when the skin is installed, every time the app opens and every 2 minutes while it stays open (FM closed). « Check my setup » does it right away and checks everything. Everything at the top of the page must be green. If Windows or your antivirus blocks the app, what to do is in « Common problems » below.",
    "Restart FM",
    "Fully close FM (Quit game, not just back to the menu), then start it again and open a club page (Overview). A club with no photo in the pack keeps the generic stadium in the club's colours: that is normal.",
  ]],
  stAvTitre: ["Windows ou mon antivirus bloque l'app", "Windows or my antivirus blocks the app"],
  stAvTxt: ["La « Protection contre les ransomwares » de Windows (accès contrôlé aux dossiers) empêche les programmes inconnus d'écrire dans Documents, donc dans ton dossier graphics : l'app ne peut pas y préparer config.xml et FM n'affiche aucune photo. Pour autoriser l'app :",
            "Windows « Ransomware protection » (controlled folder access) stops unknown programs from writing to Documents, so to your graphics folder: the app cannot prepare config.xml there and FM shows no photo. To allow the app:"],
  stAvEtapes: [[
    "Ouvre Sécurité Windows (menu Démarrer, tape « Sécurité Windows »).",
    "Protection contre les virus et menaces, puis tout en bas « Gérer la protection contre les ransomwares ».",
    "Si « Dispositif d'accès contrôlé aux dossiers » est activé : clique « Autoriser une application via l'accès contrôlé aux dossiers », puis « Ajouter une application autorisée » > « Parcourir toutes les applications ».",
    "Ajoute les programmes ci-dessous (le Python de l'app, un par un), puis reviens ici et clique « Vérifier mon installation ». Tu peux aussi désactiver l'accès contrôlé le temps de l'installation, puis le réactiver.",
  ], [
    "Open Windows Security (Start menu, type « Windows Security »).",
    "Virus & threat protection, then at the very bottom « Manage ransomware protection ».",
    "If « Controlled folder access » is on: click « Allow an app through Controlled folder access », then « Add an allowed app » > « Browse all apps ».",
    "Add the programs below (the app's Python, one by one), then come back here and click « Check my setup ». You can also turn controlled folder access off during the setup, then back on.",
  ]],
  stAvAutre: ["Autre antivirus (Avast, AVG, Norton, Kaspersky, Bitdefender…) : cherche « exceptions » ou « applications autorisées » dans ses réglages et ajoute les mêmes programmes, ou mets-le en pause quelques minutes.",
              "Other antivirus (Avast, AVG, Norton, Kaspersky, Bitdefender…): look for « exceptions » or « allowed apps » in its settings and add the same programs, or pause it for a few minutes."],
  stArboBon: ["✓ Bon", "✓ Right"],
  stArboFaux: ["✕ Faux (dossier en trop)", "✕ Wrong (one folder too many)"],
  stOuvrirGraphics: ["Ouvrir le dossier graphics", "Open the graphics folder"],
  stFaqTitre: ["Problèmes fréquents", "Common problems"],
  stFaq: [[
    "L'app supprime-t-elle mes fichiers ?",
    "Non. Elle réécrit seulement le config.xml de FMVE Stadium et refait ses propres liens dans « FMVE Stadium Links » (des liens, pas des copies : effacer un lien n'efface pas la photo). Une vraie image posée par erreur dans « FMVE Stadium Links » est remise dans FMVE Stadium. Tout ce qu'elle doit déplacer va dans « graphics (mis de côté) », à côté de graphics : rien n'est jamais effacé. Les dossiers qui n'ont pas « FMVE » dans leur nom (packs d'autres sites, tes dossiers à toi) sont seulement lus.",
    "Toujours le stade générique, sur tous les clubs",
    "Clique « Vérifier mon installation » et corrige ce qui est rouge. Ensuite ferme FM complètement et relance-le : FM ne lit les photos qu'au démarrage. Si Steam a mis le jeu à jour ou vérifié ses fichiers, réinstalle le skin.",
    "Certains clubs n'ont pas de photo",
    "Normal : le pack n'a pas tous les clubs (surtout les petits). Ils gardent le stade générique aux couleurs du club. Tu peux ajouter tes propres photos (voir plus bas).",
    "J'ai décompressé, mais l'app trouve 0 photo",
    "Le pack est sûrement ailleurs (Téléchargements, Bureau…) ou dans un autre dossier graphics. Ouvre le dossier graphics avec le bouton de l'étape 3 et refais l'étape 4 dedans. Si tu utilises un autre dossier graphics que celui de base, choisis-le ci-dessous.",
    "Une photo est fausse ou floue",
    "Remplace-la dans FMVE Stadium par une image au même numéro (même nom de fichier). C'est pris tout seul (FM fermé, 2 minutes au plus, ou tout de suite avec « Vérifier mon installation »), puis relance FM.",
    "Je veux utiliser un pack de stades d'un autre site",
    "Décompresse-le dans graphics, dans SON PROPRE dossier (à côté de FMVE Stadium, jamais dedans : l'app réécrit le config.xml de FMVE Stadium), avec son config.xml (sortitoutsi, FM Scout, packs FM 24…). Rien d'autre à faire : l'app le trouve toute seule (FM fermé, 2 minutes au plus, ou tout de suite avec « Vérifier mon installation ») et range chaque photo pour les clubs de ce stade. Un stade présent dans deux packs : celui de l'autre site passe devant FMVE Stadium.",
    "J'ajoute mes propres photos à la main",
    "Le plus sûr : ton propre dossier dans graphics, SANS « FMVE » dans son nom (ex. « Mes stades »), avec tes photos et un config.xml : une ligne par photo, from=« nom de la photo sans extension », to=« graphics/pictures/stadium/<numéro du stade>/background » (même format que les packs d'internet). L'app ne modifie jamais ce dossier, il passe devant FMVE Stadium et il ne bouge pas quand tu mets à jour notre pack. Sinon : pose STADIUM<numéro du stade>.jpg dans FMVE Stadium. C'est pris tout seul (FM fermé, 2 minutes au plus, ou tout de suite avec « Vérifier mon installation »), puis relance FM.",
    "J'ai sauté des mises à jour de l'app, ou j'ai un ancien pack de stades",
    "Pas besoin de retélécharger le pack ni de toucher à tes fichiers : installe juste la dernière version de l'app (mise à jour depuis l'app, ou le nouveau Setup) et garde ton dossier FMVE Stadium tel quel. À l'ouverture, l'app reconnaît l'ancien format d'après les fichiers : soit elle le met à jour toute seule, soit elle affiche une fenêtre « Convertir » (un clic). Rien n'est supprimé : une photo en double est rangée dans « graphics (mis de côté) ». Puis relance FM.",
  ], [
    "Does the app delete my files?",
    "No. It only rewrites the FMVE Stadium config.xml and rebuilds its own links in « FMVE Stadium Links » (links, not copies: deleting a link does not delete the photo). A real image put in « FMVE Stadium Links » by mistake is moved back into FMVE Stadium. Anything it has to move goes to « graphics (mis de côté) », next to graphics: nothing is ever deleted. Folders without « FMVE » in their name (other sites' packs, your own folders) are only read.",
    "Still the generic stadium, on every club",
    "Click « Check my setup » and fix whatever is red. Then fully close FM and start it again: FM only reads the photos at startup. If Steam updated the game or verified its files, reinstall the skin.",
    "Some clubs have no photo",
    "Normal: the pack does not have every club (mostly small ones). They keep the generic stadium in the club's colours. You can add your own photos (see below).",
    "I extracted it, but the app finds 0 photos",
    "The pack is probably somewhere else (Downloads, Desktop…) or in another graphics folder. Open the graphics folder with the step 3 button and redo step 4 inside it. If you use a graphics folder other than the default one, pick it below.",
    "A photo is wrong or blurry",
    "Replace it in FMVE Stadium with an image under the same number (same file name). It is picked up on its own (FM closed, 2 minutes at most, or right away with « Check my setup »), then restart FM.",
    "I want to use a stadium pack from another site",

function pageNotes() {
  if (NOTES_MD === null) {
    fetch("/api/notes").then(r => r.json()).then(d => { NOTES_MD = d.texte || ""; if (vue.page === "notes") dessiner(); })
      .catch(() => { NOTES_MD = ""; if (vue.page === "notes") dessiner(); });
  }
  const out = [el("button", { class: "bouton discret", style: "padding-left:0", onclick: () => aller({ page: "accueil" }) }, t("notesRetour")),
    el("h1", {}, t("notesBouton")), el("p", { class: "sous-titre" }, t("notesSous"))];
  if (NOTES_MD === null) return out;
  // le fichier : « ## Français » puis « ## English » ; on garde la partie de la langue choisie
  const parties = NOTES_MD.split(/^## /m);
  const partie = parties.find(p => p.startsWith(LG === "fr" ? "Français" : "English"));   // autres langues : l'anglais
  if (!partie) return [...out, el("div", { class: "vide" }, t("notesVide"))];
  const enLigne = s => {   // **gras**, `code`, en texte (jamais en HTML)
    const span = el("span");
    for (const m of s.split(/(\*\*[^*]+\*\*|`[^`]+`)/)) {
      if (!m) continue;
      if (m.startsWith("**")) span.append(el("b", {}, m.slice(2, -2)));
      else if (m.startsWith("`")) span.append(el("code", {}, m.slice(1, -1)));
      else span.append(m);
    }
    return span;
  };
  const corps = el("div", { class: "carte notes" });
  let liste = null;
  for (const ligne of partie.split("\n").slice(1)) {
    const puce = ligne.match(/^(\s*)[-*] (.*)$/);
    if (puce) {
      if (!liste) corps.append(liste = el("ul"));
      liste.append(el("li", { class: puce[1].length ? "sous" : "" }, enLigne(puce[2])));
      continue;
    }
    liste = null;
    if (ligne.startsWith("### ")) corps.append(el("h2", {}, ligne.slice(4)));
    else if (ligne.trim() && !/^-{3,}$/.test(ligne.trim())) corps.append(el("p", {}, enLigne(ligne)));
  }
  out.push(corps);
  return out;
}

function boutonReseau(r, mini) {
  const logo = el("span", { class: "reseau-logo" });
  logo.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${r.logo}</svg>`;
  // dessin recentré : cadre carré autour de sa vraie taille (getBBox), une fois affiché
  requestAnimationFrame(() => {
    const svg = logo.firstChild;
    let b;
    try { b = svg.getBBox(); } catch { return; }
    if (!b.width) return;
    const cote = Math.max(b.width, b.height) * (r.marge || 1.12);
    const dx = (r.decale || 0) * b.width;   // triangle : centré à l'œil, pas sur son cadre
    svg.setAttribute("viewBox", `${b.x + b.width / 2 - dx - cote / 2} ${b.y + b.height / 2 - cote / 2} ${cote} ${cote}`);
  });
  return el("button", {
    class: "reseau", style: `--couleur:${r.couleur}`, title: E.liens?.[r.nom] || r.titre, "aria-label": r.titre,
    onclick: async () => { try { await api("/api/action", { type: "lien", nom: r.nom }); } catch (e) { avis(e.message); } },
  }, logo, mini ? null : el("div", {}, el("b", {}, r.titre), el("span", {}, tr(r.sous))));
}

// « Réinstaller » quand une mise à jour de l'app a changé sa vue ; les deux sens refont tout le skin (confirmation)
function carteMode(o) {
  const actif = o.actuelle === o.bloque;
  const autre = o.valeurs.map(([v]) => v).find(v => v !== o.bloque);
  // en premier, bien visible (le joueur, 2026-11-12) : la vue n'est faite que pour le mode Large
  const sous = [el("span", { class: "badge rouge" }, t("guruLarge")),
    el("span", { class: "badge " + (actif ? "vert" : "gris") }, t(actif ? "guruActif" : "guruInactif"))];
  if (o.reinstaller) sous.push(el("span", { class: "badge violet", title: t("reinstallerAide") }, t("reinstallerBadge")));
  const dessus = el("p", { class: "option-aide erreur", style: "margin:0" },
    t("guruDessus") + o.bloquees.map(x => `« ${tr(x)} »`).join(", ") + ". "
    + (o.avec?.length ? t("guruAvec") + o.avec.map(x => `« ${tr(x)} »`).join(", ") + ". " : ""));
  const inter = el("button", {
    class: "inter", role: "switch", "aria-checked": String(actif), disabled: bloque(), title: t(actif ? "guruDesactiver" : "guruActiver"),
    onclick: () => {
      if (E.fm_ouvert) return avis(t("fermeFM"));
      if (actif) confirmer(t("guruDesactiver"), t("guruDesactiverTexte"), t("guruDesactiver"), () => faire({ type: "option", nom: o.nom, valeur: autre }));
      else confirmer(t("guruActiver"), `${t("guruLarge")}\n\n${dessus.textContent}`, t("guruActiver"), () => faire({ type: "option", nom: o.nom, valeur: o.bloque }));
    },
  });
  return el("div", { class: "carte" + (actif ? " ecart" : o.reinstaller ? " a-reinstaller" : "") },
    el("div", { class: "carte-tete" }, inter,
      el("div", { class: "carte-texte" }, el("div", { class: "carte-titre" }, t("guruTitre")), el("div", { class: "carte-sous" }, sous)),
      o.reinstaller ? boutonReinstaller(o.script) : null),
