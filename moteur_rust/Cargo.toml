[package]
name = "fm27-turbo-engine"
version = "0.1.0"
edition = "2024"
description = "Moteur Rust compatible UnityPy pour les bundles Unity de FM27 (lecture, ecriture, references managees)"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310", "generate-import-lib"] }
lz4 = "1.28"
lz4_flex = { version = "0.13", default-features = false, features = ["std"] }
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
