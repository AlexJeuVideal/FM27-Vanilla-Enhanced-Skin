[package]
name = "fm27-core"
version = "0.1.0"
edition = "2024"
description = "Modele natif du skin FM27 (valeurs, arbre, notes) sans PyO3, pour le portage en Rust"

[lib]
name = "fm27_core"
path = "src/lib.rs"

[dev-dependencies]
flate2 = "1"

[dependencies]
lz4_flex = { version = "0.13", default-features = false, features = ["std"] }
sha2 = "0.10"
serde_json = "1"
png = "0.17"
