[package]
name = "fm27-packs"
version = "0.1.0"
edition = "2024"
description = "Packs graphiques (logos, visages, stades, trophées) : décompression et rangement dans graphics, pour l'app et le serveur"

[lib]
name = "fm27_packs"
path = "src/lib.rs"

[dependencies]
serde_json = "1"
# .zip (zip64 compris)
zip = { version = "2", default-features = false, features = ["deflate"] }
# .rar lus en Rust pur (Apache-2.0) : packs de stades et de trophées sans 7-Zip ni UnRAR
rars = { version = "0.13", default-features = false, features = ["parallel"] }
